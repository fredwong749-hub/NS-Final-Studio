<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分集编辑器 · 原型 v3</title>
<style>
:root, :root[data-theme="dark"] {
  --bg: #0f1115; --bg2: #151820; --panel: #1a1e27; --panel2: #212633; --line: #2a3040; --line2: #363d50;
  --fg: #e8eaf0; --fg2: #a9afbf; --fg3: #6f7689; --accent: #6c8cff; --accent-fg: #fff; --accent-soft: rgba(108,140,255,.16);
  --grey: #6f7689; --blue: #4f8cff; --green: #3ccf7a; --amber: #f2b33d; --red: #ef5b5b; --lock: #b07cff;
  --shadow: 0 8px 30px rgba(0,0,0,.45); --ph1: #232838; --ph2: #2c3245; color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f4f5f8; --bg2: #eceef3; --panel: #ffffff; --panel2: #f3f4f8; --line: #e1e4ec; --line2: #cfd4df;
  --fg: #1a1d26; --fg2: #4f5668; --fg3: #8a91a3; --accent: #3d63f0; --accent-fg: #fff; --accent-soft: rgba(61,99,240,.10);
  --grey: #a3a9b8; --blue: #3d7bf5; --green: #22a85a; --amber: #d99012; --red: #dc3f3f; --lock: #8a55e6;
  --shadow: 0 8px 30px rgba(20,30,60,.16); --ph1: #e6e9f0; --ph2: #d9dde7; color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
:root { --hdr: 52px; --strip: 120px; --left: 220px; --right: 368px; --leftc: 56px; }
@media (max-width: 1440px) { :root { --left: 192px; --right: 324px; } .step .sub, .brand small { display: none; } .hdr { gap: 10px; } .step { padding: 6px 9px; } .epsel { max-width: 170px; } }

.app { display: grid; height: 100vh; grid-template-rows: var(--hdr) 1fr var(--strip); grid-template-columns: var(--left) minmax(0, 1fr) var(--right);
  grid-template-areas: "hdr hdr hdr" "left center right" "strip strip strip"; }
.app.lc { --left: var(--leftc); }
.app.listmode { grid-template-columns: var(--left) minmax(0, 1fr); grid-template-areas: "hdr hdr" "left center" "strip strip"; }
.app.listmode .right { display: none; }

/* header */
.hdr { grid-area: hdr; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--bg2); border-bottom: 1px solid var(--line); }
.brand { font-weight: 700; letter-spacing: .5px; white-space: nowrap; }
.brand small { color: var(--fg3); font-weight: 400; margin-left: 6px; }
.epsel { background: var(--panel); border: 1px solid var(--line2); color: var(--fg); border-radius: 8px; padding: 6px 8px; max-width: 220px; }
.steps { display: flex; gap: 4px; margin: 0 auto; }
.step { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid transparent; background: none; color: var(--fg2); white-space: nowrap; }
.step .n { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; background: var(--panel2); border: 1px solid var(--line2); }
.step.on { background: var(--accent-soft); color: var(--fg); border-color: var(--accent); }
.step.on .n { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.step.ok .n { background: var(--green); border-color: var(--green); color: #fff; }
.step .sub { font-size: 11px; color: var(--fg3); }
.hbtns { display: flex; gap: 8px; align-items: center; }
.iconbtn { background: none; border: 1px solid var(--line2); border-radius: 8px; padding: 6px 10px; color: var(--fg2); white-space: nowrap; }
.iconbtn:hover { color: var(--fg); border-color: var(--fg3); }
.pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel2); color: var(--fg3); border: 1px dashed var(--line2); white-space: nowrap; cursor: pointer; }

/* left rail */
.left { grid-area: left; border-right: 1px solid var(--line); background: var(--bg2); overflow-y: auto; overflow-x: hidden; padding: 12px; }
.app.lc .left { padding: 10px 7px; }
.sect { font-size: 11px; color: var(--fg3); letter-spacing: 1px; margin: 4px 0 8px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.collapse { background: none; border: 1px solid var(--line2); border-radius: 6px; color: var(--fg3); padding: 0 6px; font-size: 12px; line-height: 20px; }
.collapse:hover { color: var(--fg); }
.char { position: relative; border-radius: 10px; overflow: hidden; margin-bottom: 10px; border: 1px solid var(--line); background: var(--panel); transition: opacity .2s; }
.char.dim { opacity: .38; }
.char img { display: block; width: 100%; aspect-ratio: 6/5; object-fit: cover; object-position: center 4%; }
@media (max-height: 820px) { .char img { aspect-ratio: 5/4; } }
.char .meta { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 8px; background: linear-gradient(transparent, rgba(0,0,0,.78)); color: #fff; display: flex; align-items: flex-end; justify-content: space-between; }
.char .nm { font-weight: 600; font-size: 14px; }
.char .lk { font-size: 11px; opacity: .8; }
.letter { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #fff; font-weight: 700; display: grid; place-items: center; }
.char .here { position: absolute; top: 8px; left: 8px; font-size: 10px; padding: 1px 7px; border-radius: 99px; background: rgba(0,0,0,.6); color: #fff; }
.ava { position: relative; width: 42px; height: 42px; margin: 0 auto 10px; border-radius: 50%; border: 2px solid var(--line2); overflow: visible; cursor: default; transition: opacity .2s; }
.ava img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: center 8%; display: block; }
.ava.here { border-color: var(--accent); }
.ava.dim { opacity: .4; }
.ava b { position: absolute; right: -4px; bottom: -3px; width: 16px; height: 16px; border-radius: 5px; background: var(--accent); color: #fff; font-size: 10px; display: grid; place-items: center; }
.scmini { display: block; width: 42px; margin: 0 auto 6px; padding: 3px 0; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); font-size: 10px; color: var(--fg3); text-align: center; }
.scmini.cur { border-color: var(--accent); color: var(--fg); }
.hovercard { position: fixed; z-index: 50; width: 300px; background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; box-shadow: var(--shadow); padding: 12px; display: none; }
.hovercard h4 { margin: 0 0 6px; font-size: 14px; }
.hovercard dl { display: grid; grid-template-columns: 52px 1fr; gap: 4px 8px; margin: 8px 0; }
.hovercard dt { color: var(--fg3); }
.hovercard dd { margin: 0; }
.hovercard .refs { display: flex; gap: 6px; }
.hovercard .refs figure { margin: 0; flex: 1; }
.hovercard .refs img { width: 100%; aspect-ratio: 9/16; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
.hovercard figcaption { font-size: 10px; color: var(--fg3); }
.scenes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.scene { display: flex; flex-direction: column; gap: 4px; padding: 5px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.scene.cur { border-color: var(--accent); }
.scene .ph { width: 100%; height: 40px; border-radius: 6px; flex: none; display: grid; place-items: center; font-size: 10px; color: var(--fg3); text-align: center;
  background: repeating-linear-gradient(45deg, var(--ph1) 0 6px, var(--ph2) 6px 12px); }
.scene .t { font-size: 12px; }
.scene .s { font-size: 11px; color: var(--fg3); }

/* center */
.center { grid-area: center; overflow: hidden; display: flex; flex-direction: column; padding: 10px 20px 10px; min-width: 0; }
.epbar { display: flex; align-items: center; gap: 12px; height: 34px; flex: none; min-width: 0; }
.epbar .ept { font-size: 15px; font-weight: 700; white-space: nowrap; }
.epbar .eps { color: var(--fg3); font-size: 12px; white-space: nowrap; }
.epbar .sp { flex: 1; }
.decide { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; padding: 3px 4px 3px 10px; border-radius: 9px; background: rgba(242,179,61,.10); border: 1px solid rgba(242,179,61,.45); }
.decide > b { font-size: 12px; color: var(--amber); white-space: nowrap; }
.decide button { border: 1px solid var(--line2); background: var(--panel); border-radius: 7px; padding: 1px 9px; font-size: 12px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.decide button.wait { color: var(--fg3); border-style: dashed; }
.decide button i { font-style: normal; font-size: 11px; background: var(--amber); color: #000; border-radius: 99px; padding: 0 6px; }
.decide button.wait i { background: var(--panel2); color: var(--fg3); }
.seg { display: flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; flex: none; }
.seg button { white-space: nowrap; background: none; border: 0; padding: 4px 12px; color: var(--fg2); }
.seg button.on { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.seg kbd { font: 10px ui-monospace, monospace; color: var(--fg3); margin-left: 4px; }

.shothead { display: flex; align-items: center; gap: 10px; height: 34px; flex: none; }
.shothead .id { font-size: 20px; font-weight: 700; }
.shothead .hinfo { color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.shothead .sp { flex: 1; }
.back { background: none; border: 1px solid var(--line2); border-radius: 8px; padding: 3px 10px; color: var(--fg2); white-space: nowrap; }
.why { background: none; border: 0; color: var(--fg3); text-decoration: underline dotted; padding: 2px 4px; white-space: nowrap; }
.why:hover { color: var(--fg); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.dot.none { background: var(--grey); } .dot.gen { background: var(--blue); animation: pulse 1.1s infinite; } .dot.done { background: var(--green); }
.dot.stale { background: transparent; box-shadow: inset 0 0 0 2px var(--amber); }
.dot.review { background: var(--amber); } .dot.fail { background: var(--red); }
.dot.locked { background: none; width: auto; height: auto; color: var(--lock); font-size: 11px; line-height: 1; }
@keyframes pulse { 50% { opacity: .35; } }
.stlabel { font-size: 12px; color: var(--fg2); display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }

:root { --paneH: min(calc(100vh - var(--hdr) - var(--strip) - 206px), calc((100vw - var(--left) - var(--right) - 40px - 36px) / 3 * 16 / 9)); }
.app.listmode { --paneH: 0; }
.panes { display: flex; gap: 18px; justify-content: center; margin-top: 6px; flex: none; }
.pane { position: relative; height: var(--paneH); aspect-ratio: 9/16; border-radius: 12px; overflow: hidden; background: var(--panel); border: 2px solid var(--line); cursor: pointer; }
.pane.focus { border-color: var(--accent); }
.pane .lab { position: absolute; top: 8px; left: 8px; z-index: 3; font-size: 12px; padding: 2px 9px; border-radius: 99px; background: rgba(0,0,0,.55); color: #fff; }
.pane .key { position: absolute; top: 8px; right: 8px; z-index: 3; font-size: 10px; padding: 1px 6px; border-radius: 4px; background: rgba(0,0,0,.4); color: #ddd; }
.pane img.full { width: 100%; height: 100%; object-fit: cover; display: block; }
.empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--fg3); text-align: center; padding: 18px;
  background: repeating-linear-gradient(135deg, var(--ph1) 0 10px, var(--panel) 10px 20px); }
.empty .big { font-size: 34px; opacity: .6; }
.empty b { color: var(--fg2); font-weight: 600; }
.empty .mini { font-size: 11px; }
.empty button { background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 12px; color: var(--fg); }
.locked .empty { background: repeating-linear-gradient(135deg, rgba(176,124,255,.10) 0 10px, var(--panel) 10px 20px); color: var(--lock); }
.genov { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #fff; background: rgba(10,14,30,.62); backdrop-filter: blur(2px); }
.spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; animation: rot .9s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.bar { width: 60%; height: 4px; background: rgba(255,255,255,.2); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--blue); width: 0; }
.play { position: absolute; inset: 0; display: grid; place-items: center; z-index: 2; }
.play span { width: 56px; height: 56px; border-radius: 50%; background: rgba(0,0,0,.5); display: grid; place-items: center; color: #fff; font-size: 22px; }
.vprog { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.18); z-index: 3; }
.vprog i { display: block; height: 100%; background: var(--accent); width: 0; }
.vtime { position: absolute; bottom: 10px; right: 10px; z-index: 3; font-size: 11px; color: #fff; background: rgba(0,0,0,.5); padding: 1px 6px; border-radius: 4px; }
.vlayer { position: absolute; inset: 0; transition: opacity .25s; }

.underrow { display: flex; align-items: flex-end; gap: 16px; margin-top: 10px; flex: none; }
.cands { flex: 1; min-width: 0; }
.cands .ct { font-size: 11px; color: var(--fg3); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cands .ct b { color: var(--fg2); font-weight: 600; }
.cands .row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; height: 76px; align-items: center; }
.cand { position: relative; height: 70px; aspect-ratio: 9/16; border-radius: 6px; overflow: hidden; border: 2px solid var(--line); flex: none; background: var(--panel); padding: 0; }
.cand img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cand.sel { border-color: var(--green); }
.cand.pick { box-shadow: 0 0 0 2px var(--accent); }
.cand.new::after { content: "新"; position: absolute; top: 2px; right: 2px; font-size: 9px; background: var(--amber); color: #000; border-radius: 3px; padding: 0 3px; }
.cand .no { position: absolute; bottom: 2px; left: 3px; font-size: 10px; color: #fff; text-shadow: 0 1px 2px #000; }
.cands .none { color: var(--fg3); font-size: 12px; }
.actions { display: flex; gap: 8px; align-items: center; flex: none; position: relative; }
.btn { border-radius: 10px; padding: 10px 18px; border: 1px solid var(--line2); background: var(--panel2); color: var(--fg); font-weight: 600; white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.more { padding: 10px 12px; }
.btn.sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
.menu { position: fixed; z-index: 60; min-width: 210px; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; display: none; }
.menu button { display: flex; width: 100%; text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: 6px; justify-content: space-between; gap: 12px; white-space: nowrap; }
.menu button:hover { background: var(--panel2); }
.menu .hr { height: 1px; background: var(--line); margin: 4px 0; }
.menu .mh { font-size: 11px; color: var(--fg3); padding: 4px 10px 2px; }
.menu kbd { font: 11px ui-monospace, monospace; color: var(--fg3); }

.pop { position: fixed; z-index: 70; width: 400px; max-height: 64vh; overflow: auto; background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; box-shadow: var(--shadow); padding: 14px; display: none; }
.pop h4 { margin: 0 0 6px; }
.pop textarea { width: 100%; min-height: 90px; }
.pop .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
.pop .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.pop .chips button { border: 1px solid var(--line2); background: var(--panel2); border-radius: 99px; padding: 3px 10px; font-size: 12px; }
.pop ul { margin: 6px 0; padding-left: 18px; }
.pop li { margin: 3px 0; }
.whybox ul { margin: 4px 0 8px; padding-left: 18px; }
.whybox li { margin: 2px 0; }
.whybox .gh { font-size: 12px; color: var(--fg3); margin-top: 10px; display: flex; gap: 6px; align-items: center; }
.whybox .who { font-size: 10px; border: 1px solid var(--line2); border-radius: 99px; padding: 0 6px; color: var(--fg3); margin-left: 4px; }
.whybox .raw { font: 11px/1.5 ui-monospace, Consolas, monospace; color: var(--fg3); white-space: pre-wrap; }

/* right (精修) */
.right { grid-area: right; border-left: 1px solid var(--line); background: var(--bg2); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); flex: none; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px 8px; color: var(--fg3); white-space: nowrap; }
.tabs button.on { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.tabs button i { font-style: normal; font-size: 10px; margin-left: 4px; padding: 0 5px; border-radius: 99px; background: var(--panel2); color: var(--fg3); }
.tabs button i.warn { background: rgba(239,91,91,.18); color: var(--red); }
.right .scroll { flex: 1; overflow-y: auto; padding: 14px 14px 6px; }
.right .foot { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.right .foot .hint { font-size: 11px; color: var(--fg3); flex: 1; }
.fld { margin-bottom: 14px; }
.fld > label, .fld > .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--fg2); margin-bottom: 5px; font-weight: 600; }
.fld > label span, .fld > .lbl span { font-weight: 400; color: var(--fg3); font-size: 11px; }
textarea, input[type=text] { width: 100%; background: var(--panel); color: var(--fg); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; font: 13px/1.6 inherit; font-family: inherit; resize: vertical; }
textarea:focus, input:focus { outline: none; border-color: var(--accent); }
textarea.dirty, input.dirty { border-color: var(--amber); }
textarea.mono { font: 11.5px/1.55 ui-monospace, Consolas, monospace; }
.dl { display: grid; grid-template-columns: 88px 1fr; gap: 6px; align-items: start; margin-bottom: 6px; }
.dl .who { font-size: 12px; color: var(--fg3); padding-top: 8px; }
.vo { font-size: 12px; color: var(--fg3); }
details.h3 { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel); }
details.h3 summary { cursor: pointer; font-size: 12px; color: var(--fg2); font-weight: 600; }
details.h3 textarea { margin-top: 8px; min-height: 220px; }
.ro { font-size: 12px; color: var(--fg2); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; word-break: break-word; }
.ro.dash { color: var(--fg3); }
.lockmsg { padding: 30px 16px; text-align: center; color: var(--lock); }
.vseg { display: flex; gap: 4px; margin-bottom: 10px; }
.vseg button { flex: 1; border: 1px solid var(--line2); background: var(--panel); border-radius: 8px; padding: 4px 0; color: var(--fg2); font-size: 12px; }
.vseg button.on { border-color: var(--accent); color: var(--fg); background: var(--accent-soft); }
.vgrp { font-size: 13px; font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.vgrp span { font-weight: 400; font-size: 11px; color: var(--fg3); }
.vgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
.vgrid .cand { height: auto; width: 100%; }
.vgrid .cand .cur { position: absolute; top: 2px; left: 2px; font-size: 9px; background: var(--green); color: #fff; border-radius: 3px; padding: 0 3px; }
.vcmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.vcmp figure { margin: 0; text-align: center; }
.vcmp img, .vcmp .ph { width: 100%; aspect-ratio: 9/16; object-fit: cover; border-radius: 8px; border: 2px solid var(--line2); display: block; }
.vcmp .ph { display: grid; place-items: center; color: var(--fg3); font-size: 11px; border-style: dashed; }
.vcmp figure.chosen img { border-color: var(--green); }
.vcmp figcaption { font-size: 11px; color: var(--fg2); margin: 4px 0; }
.vbtns { display: flex; gap: 6px; margin-top: 10px; }
.vbtns .btn { flex: 1; }
.refrow { display: flex; gap: 6px; flex-wrap: wrap; }
.refrow figure { margin: 0; width: 76px; }
.refrow img { width: 76px; aspect-ratio: 9/16; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); display: block; }
.refrow figcaption { font-size: 10px; color: var(--fg3); line-height: 1.3; margin-top: 2px; }
.kv { display: grid; grid-template-columns: 70px 1fr; gap: 6px 10px; font-size: 12px; }
.kv dt { color: var(--fg3); }
.kv dd { margin: 0; color: var(--fg2); }

/* clip strip */
.strip { grid-area: strip; border-top: 1px solid var(--line); background: var(--bg2); display: flex; align-items: center; gap: 12px; padding: 8px 14px; min-width: 0; }
.clips { flex: 1; display: flex; gap: 8px; overflow-x: auto; height: 100%; align-items: center; min-width: 0; }
.clip { position: relative; flex: none; height: 92px; width: 66px; border-radius: 8px; overflow: hidden; border: 2px solid var(--line); background: var(--panel); padding: 0; }
.clip.cur { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.clip.inview:not(.cur) { border-color: var(--fg3); }
.clip.msel { border-color: var(--amber); }

<script src="data.js"></script>
<script>
(() => {
const D = window.PROTO_DATA;
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const CHAR_NAMES = { lin_wan: "林晚", gu_chen: "顾沉", chen_yu: "陈宇" };
const SLOT_NAMES = { first: "首帧", last: "尾帧", video: "视频" };
// 统一词表（spec §5）
const STATUS = { none: "未出", gen: "生成中", review: "待你审", done: "已定", fail: "失败", locked: "成人镜（待项目方）", stale: "过期" };
const TIME = { night: "夜", morning: "早", dusk: "黄昏", day: "日", "": "" };
const FRAMING = { close: "近景", medium: "中景", wide: "远景", extreme_close: "特写" };
const RULES = {
  "P-B2": "首尾帧还没按 768×1344 预裁", "R-C1": "首/尾帧缺失或还没过闸", "R-C2": "还没选定图（首帧/尾帧/链）",
  "R-C6": "首帧还没跑 S3-F 闸", "R-C7": "前后镜衔接还没检查", "R-C8": "输入版本过期，需要重新编译",
  "R-C10": "首集样片（G4）还没锁定", "S3-K1": "首尾关键帧缺失", "R-C4": "视频 LoRA 还没验收（会不带 LoRA 出视频）",
};
const LORA_ST = { accepted: "已验收", training: "训练中", missing: "未训练" };

// ---------- state ----------
const st = {
  cur: 0, slot: "first", mode: "list", demo: true, msel: new Set(), rtab: "prompt", vslot: null, vpick: null,
  leftC: innerWidth < 1440, listScroll: 0, open: {}, inview: 0,
  shots: D.shots.map((s) => ({ src: s, edits: {}, cands: { first: [], last: [], video: [] }, sel: { first: null, last: null, video: null }, gen: {}, fail: false, lock: { first: null, last: null }, stale: false, staleDown: false })),
  playing: false, playT: 0,
};
const isList = () => st.mode === "list";
const isPage = () => st.mode === "script" || st.mode === "api";
let candSeq = 0;
function hue(i) { return (i * 47 + 200) % 360; }
function placeholder(shotIdx, slot, n, label) {
  const h = (hue(shotIdx) + n * 23) % 360, h2 = (h + 40) % 360;
  const y = slot === "last" ? 68 : 32;
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 540 960'><defs><linearGradient id='g' x1='0' y1='0' x2='.6' y2='1'><stop offset='0' stop-color='hsl(${h},38%,26%)'/><stop offset='1' stop-color='hsl(${h2},45%,12%)'/></linearGradient><radialGradient id='r' cx='.5' cy='${y / 100}' r='.5'><stop offset='0' stop-color='hsla(${h},70%,70%,.35)'/><stop offset='1' stop-color='transparent'/></radialGradient></defs><rect width='540' height='960' fill='url(#g)'/><rect width='540' height='960' fill='url(#r)'/><ellipse cx='270' cy='${y * 9.6 + 40}' rx='90' ry='230' fill='hsla(${h},30%,80%,.10)'/><circle cx='270' cy='${y * 9.6 - 150}' r='62' fill='hsla(${h},30%,85%,.12)'/><text x='270' y='860' font-family='sans-serif' font-size='44' fill='rgba(255,255,255,.75)' text-anchor='middle'>S${shotIdx} · ${SLOT_NAMES[slot]} · #${n}</text><text x='270' y='912' font-family='sans-serif' font-size='28' fill='rgba(255,255,255,.4)' text-anchor='middle'>${(label || '占位图（原型，无后端）').replace(/[<&']/g, '')}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
function addCand(sh, slot, pending, meta) {
  const n = sh.cands[slot].length + 1;
  const m = meta || {};
  const c = { id: ++candSeq, n, url: placeholder(sh.src.index, slot, n, m.label), isNew: pending, parent: m.parent ?? null, mode: m.mode || "生成", instr: m.instr || "", strength: m.strength || "", refs: m.refs || [], gpu: m.gpu || "gpu3 · Image 2.1", at: new Date().toTimeString().slice(0, 5) };
  sh.cands[slot].push(c);
  return c;
}
function resetShots() { st.shots.forEach((sh) => { sh.cands = { first: [], last: [], video: [] }; sh.sel = { first: null, last: null, video: null }; sh.gen = {}; sh.fail = false; sh.lock = { first: null, last: null }; sh.stale = false; sh.staleDown = false; }); }
function seedDemo() {
  resetShots();
  // 原型演示：各种状态各来一个
  const plan = { 1: "video", 2: "review", 3: "frames", 4: "gen", 6: "fail", 7: "review", 9: "frames" };
  st.shots.forEach((sh) => {
    const p = plan[sh.src.index];
    if (!p || sh.src.adult) return;
    const two = (k, pickN) => { addCand(sh, k); addCand(sh, k); if (pickN) addCand(sh, k); sh.sel[k] = sh.cands[k][1].id; };
    if (p === "video") { two("first", true); two("last"); two("video"); sh.lock.first = sh.sel.first; sh.lock.last = sh.sel.last; }
    if (p === "frames") { two("first"); two("last"); sh.lock.first = sh.sel.first; sh.lock.last = sh.sel.last; }
    if (p === "frames" && sh.src.index === 3) { const c = sh.cands.first[1]; const e = addCand(sh, "first", false, { parent: c.id, mode: "指令改图", instr: "（原型演示：这里是项目方原话）", strength: "小", label: "指令改图 · 幅度 小" }); }
    if (p === "review") { ["first", "last"].forEach((k) => { addCand(sh, k); sh.sel[k] = sh.cands[k][0].id; addCand(sh, k, true); }); }
    if (p === "gen") { startGen(sh, ["first", "last"], 1e9, true); }
    if (p === "fail") { addCand(sh, "first"); sh.sel.first = sh.cands.first[0].id; sh.fail = true; }
  });
}
const selCand = (sh, slot) => sh.cands[slot].find((c) => c.id === sh.sel[slot]) || null;
const cur = () => st.shots[st.cur];
const hasNew = (sh, slot) => sh.cands[slot].some((c) => c.isNew);

// 状态点 + 一句“下一步”（spec §2/§5：只说下一步，不说系统内部状态）
function nextOf(sh) {
  const i = st.shots.indexOf(sh);
  if (sh.src.adult) return { stt: "locked", say: "待项目方处理", btn: null };
  if (Object.keys(sh.gen).length) return { stt: "gen", say: "生成中，稍等", btn: "生成中…", disabled: true };
  if (sh.fail) return { stt: "fail", say: "生成失败，再出一次", btn: "重新生成", act: () => { st.cur = i; regen(["first", "last"]); } };
  if (sh.stale) return { stt: "stale", say: "参考改了，需重出首帧", btn: "重出首帧", act: () => { st.cur = i; regen(["first"]); } };
  for (const k of ["first", "last", "video"]) {
    if (hasNew(sh, k)) return { stt: "review", say: `待你审${SLOT_NAMES[k]}`, btn: `审${SLOT_NAMES[k]}`, act: () => { st.cur = i; st.slot = k; openCompareDefault(); } };
  }
  const f = selCand(sh, "first"), v = selCand(sh, "video");
  // §7.2 定稿关口：首帧 → 尾帧 → 视频
  if (!f) return { stt: "none", say: "下一步：出首帧", btn: "出首帧", act: () => { st.cur = i; regen(["first"]); } };
  if (!sh.lock.first) return { stt: "review", say: "待你定稿首帧", btn: "定稿首帧", act: () => { st.cur = i; lockSlot(sh, "first"); } };
  if (sh.staleDown) return { stt: "stale", say: "首帧改过，尾帧/视频过期", btn: "重出尾帧", act: () => { st.cur = i; regen(["last"]); } };
  if (!selCand(sh, "last")) return { stt: "none", say: "首帧已定稿，下一步出尾帧", btn: "出尾帧", act: () => { st.cur = i; regen(["last"]); } };
  if (!sh.lock.last) return { stt: "review", say: "待你定稿尾帧", btn: "定稿尾帧", act: () => { st.cur = i; lockSlot(sh, "last"); } };
  if (!v) return { stt: "done", say: "首尾帧已定稿，下一步出视频", btn: "出视频", act: () => { st.cur = i; regen(["video"]); } };
  return { stt: "done", say: "已定，无需操作", btn: "看视频", act: () => { st.cur = i; st.slot = "video"; setMode("edit"); togglePlay(); } };
}
function lockSlot(sh, slot) {
  const c = selCand(sh, slot);
  if (!c) return toast(`还没有${SLOT_NAMES[slot]}`);
  if (slot === "last" && !sh.lock.first) return toast("先定稿首帧");
  sh.lock[slot] = c.id; c.isNew = false;
  if (slot === "last") sh.staleDown = false;
  toast(`S${sh.src.index} ${SLOT_NAMES[slot]}已定稿 #${c.n}${slot === "first" ? " · 现在可以做尾帧" : " · 现在可以出视频"}`);
  render();
}
function unlockFirst(sh) {
  // 改了已定稿的首帧 → 尾帧和视频自动过期
  if (!sh.lock.first) return false;
  sh.lock.first = null; sh.lock.last = null;
  if (sh.cands.last.length || sh.cands.video.length) sh.staleDown = true;
  return true;
}
const statusOf = (sh) => nextOf(sh).stt;

// ---------- generation (fake) ----------
function startGen(sh, slots, ms, silent) {
  slots.forEach((slot) => {
    const dur = ms || (slot === "video" ? 4200 : 2600);
    const t0 = performance.now();
    const rec = sh.gen[slot] = { t0, dur };
    sh.fail = false;
    if (dur > 100000) return; // demo: stays generating
    setTimeout(() => {
      if (sh.gen[slot] !== rec) return; // 已取消
      delete sh.gen[slot];
      if (slot === "first") sh.stale = false;
      if (slot === "last") sh.staleDown = false;
      const c = addCand(sh, slot, true);
      if (!sh.sel[slot]) { sh.sel[slot] = c.id; }
      toast(`S${sh.src.index} ${SLOT_NAMES[slot]}出了新候选（#${c.n}），待你审`);
      render();
    }, dur);
  });
  if (!silent) render();
}
function regen(slots, why) {
  const sh = cur();
  if (sh.src.adult) return toast("成人镜不在这里出，待项目方处理");
  if (slots.includes("video") && !(sh.lock.first && sh.lock.last)) { slots = slots.filter((s) => s !== "video"); toast("首尾帧都定稿后才能出视频"); }
  if (slots.includes("last") && !sh.lock.first) { slots = slots.filter((s) => s !== "last"); toast("先定稿首帧，尾帧由定稿首帧编辑而来"); }
  if (slots.includes("first") && unlockFirst(sh)) toast("首帧改了：尾帧和视频标为过期");
  if (!slots.length) return;
  startGen(sh, slots);
  toast(`已排队：S${sh.src.index} ${slots.map((s) => SLOT_NAMES[s]).join("、")}${why ? " · 诉求：" + why : ""}`);
}
setInterval(() => {
  document.querySelectorAll("[data-genbar]").forEach((el) => {
    const [i, slot] = el.dataset.genbar.split(":");
    const g = st.shots[i].gen[slot];
    if (!g) return;
    const p = g.dur > 100000 ? ((performance.now() - g.t0) / 9000) % 1 : Math.min(1, (performance.now() - g.t0) / g.dur);
    el.style.width = (p * 100).toFixed(1) + "%";
  });
}, 100);

// ---------- header ----------
function renderHeader() {
  const sel = $("#epsel");
  if (!sel.options.length) {
    sel.innerHTML = D.episodes.map((e) => `<option value="${e.number}" ${e.number === 2 ? "selected" : ""}>第 ${e.number} 集 · ${esc(e.title)}（${e.shots} 镜）</option>`).join("");
    sel.onchange = () => { if (sel.value !== "2") { toast(`原型只载入了第 2 集；正式版这里直接切到第 ${sel.value} 集`); sel.value = "2"; } };
  }
  const shots = st.shots.filter((s) => !s.src.adult);
  const nFrames = shots.filter((s) => selCand(s, "first") && selCand(s, "last")).length;
  const nVid = shots.filter((s) => selCand(s, "video")).length;
  const steps = [
    ["剧本", D.s1.g3_accepted ? "已验收" : "待验收", st.mode === "script" ? "on" : D.s1.g3_accepted ? "ok" : ""], ["角色·场景", D.episode.look_confirmed ? "造型已确认" : "待确认", D.episode.look_confirmed ? "ok" : ""],

  ];

function decisions() {

function openKeys(anchor) {
  pop.innerHTML = `<h4>快捷键</h4><ul><li>L 审片 ⇄ 精修；Enter / 双击行 进精修；Esc 回审片（保留滚动位置）</li><li>审片：↑ / ↓ 选镜</li><li>精修：← / → 切镜，Space 播放，1 / 2 / 3 聚焦首帧 / 尾帧 / 视频</li><li>C 并排对比候选（对比里 ←/→ 换，Enter 选定）</li><li>Ctrl/⌘ 点底部缩略图 多选</li></ul>`;
  place(pop, anchor, true); pop.style.left = (innerWidth - pop.offsetWidth - 12) + "px";
}
$("#toolsBtn").onclick = (e) => openTools(e.currentTarget);
function toggleDemo() { st.demo = !st.demo; stopPlay(); if (st.demo) seedDemo(); else resetShots(); render(); toast(st.demo ? "原型假状态：用占位图演示各种状态" : "真实状态：第 2 集目前一张都还没出"); }
$("#statepill").onclick = toggleDemo;

// ---------- compare ----------
const modal = $("#modal");
let cmp = null;
function openCompareDefault() {
  const sh = cur(), cs = sh.cands[st.slot];
  if (sh.src.adult) return toast("成人镜不预览");
  if (cs.length < 1) return toast(`还没有${SLOT_NAMES[st.slot]}候选`);
  const other = cs.filter((c) => c.id !== sh.sel[st.slot]);
  openCompare((other.find((c) => c.isNew) || other[other.length - 1] || cs[0]).id);
}
function openCompare(id) {
  const sh = cur(), cs = sh.cands[st.slot];
  cmp = { id };
  const c = cs.find((x) => x.id === id), s = selCand(sh, st.slot);
  const left = s && s.id !== id ? s : null;
  const idx = cs.indexOf(c);
  const pickTxt = s && c.n < s.n ? `回退到 #${c.n}` : "选定这张";
  $("#mbox").innerHTML = `<h3><span>S${sh.src.index} · ${groupLabel(sh, st.slot)} · 对比</span><span style="color:var(--fg3);font-weight:400;font-size:12px">← → 换候选 · Enter 选定右边 · Esc 关闭</span></h3>
    <div class="cmp">
      ${left ? `<figure class="chosen"><img src="${left.url}"><figcaption>当前 · #${left.n}</figcaption><button class="btn" disabled>当前</button></figure>` : `<figure><div style="height:min(68vh,760px);aspect-ratio:9/16;border-radius:10px;border:2px dashed var(--line2);display:grid;place-items:center;color:var(--fg3)">${s ? "右边就是当前" : "还没选定"}</div><figcaption>当前</figcaption></figure>`}
      <figure class="${s && s.id === id ? "chosen" : ""}"><img src="${c.url}"><figcaption>候选 #${c.n}${c.isNew ? " · 新" : ""}</figcaption><button class="btn primary" id="cmpPick" ${s && s.id === id ? "disabled" : ""}>${s && s.id === id ? "当前" : pickTxt}</button></figure>
    </div>
    <div class="cmpnav"><button class="btn sm" id="cmpPrev" ${idx <= 0 ? "disabled" : ""}>← 上一个</button><span style="padding:6px;color:var(--fg3)">${idx + 1} / ${cs.length}</span><button class="btn sm" id="cmpNext" ${idx >= cs.length - 1 ? "disabled" : ""}>下一个 →</button><button class="btn sm" id="cmpRef" style="margin-left:20px">设为参考…</button><button class="btn sm" id="cmpClose">关闭</button></div>`;
  modal.classList.add("on");
  c.isNew = false;
  $("#cmpPick").onclick = () => pickCmp();
  $("#cmpPrev").onclick = () => stepCmp(-1);
  $("#cmpNext").onclick = () => stepCmp(1);
  $("#cmpClose").onclick = closeCompare;
  $("#cmpRef").onclick = (e) => P.hooks.setAsRef?.(e.currentTarget, st.cur, c, st.slot);
}
function pickCmp() { const sh = cur(); const was = selCand(sh, st.slot), c = sh.cands[st.slot].find((x) => x.id === cmp.id); sh.sel[st.slot] = cmp.id; toast(`S${sh.src.index} ${SLOT_NAMES[st.slot]}${was && c.n < was.n ? "已回退到" : "已选定"} #${c.n}`); closeCompare(); }
function stepCmp(d) { const cs = cur().cands[st.slot]; const i = cs.findIndex((c) => c.id === cmp.id) + d; if (cs[i]) openCompare(cs[i].id); }
function closeCompare() { modal.classList.remove("on"); cmp = null; render(); }
modal.onclick = (e) => { if (e.target === modal) closeCompare(); };

// ---------- nav / keys / mode ----------
function go(i, scroll) {
  if (i < 0 || i >= st.shots.length) return;
  stopPlay(); st.vpick = null;
  if (isList()) { selectRow(i, scroll !== false); return; }
  st.cur = i; render();
}
function setMode(m) {
  if (m === st.mode) return;
  const list = $("#list"); if (list) st.listScroll = list.scrollTop;
  st.mode = m; stopPlay(); closeAll(); hc.style.display = "none";
  $("#app").classList.toggle("listmode", isList());
  $("#app").classList.toggle("pagemode", isPage());
  render();
  if (isList()) { const r = $("#row" + st.cur), l = $("#list"); if (r && l) { const rr = r.getBoundingClientRect(), lr = l.getBoundingClientRect(); if (rr.top < lr.top || rr.bottom > lr.bottom) r.scrollIntoView({ block: "nearest" }); } }
}
document.addEventListener("keydown", (e) => {
  if (e.target.matches?.("textarea, input, select")) { if (e.key === "Escape") e.target.blur(); return; }
  if (P.hooks.keydown && P.hooks.keydown(e)) return;
  if (isPage()) { if (e.key === "Escape") setMode("list"); return; }
  if (cmp) {
    if (e.key === "Escape") closeCompare(); else if (e.key === "ArrowLeft") stepCmp(-1); else if (e.key === "ArrowRight") stepCmp(1); else if (e.key === "Enter") pickCmp();
    e.preventDefault(); return;
  }
  if (e.key === "Escape") { if (popOpen()) closeAll(); else if (!isList()) setMode("list"); return; }
  if (e.key === "l" || e.key === "L") { setMode(isList() ? "edit" : "list"); return; }
  if (e.key === "?") { openKeys($("#toolsBtn")); return; }
  if (isList()) {
    if (e.key === "ArrowDown" || e.key === "ArrowRight") { go(st.cur + 1); e.preventDefault(); }
    else if (e.key === "ArrowUp" || e.key === "ArrowLeft") { go(st.cur - 1); e.preventDefault(); }
    else if (e.key === "Enter") { e.preventDefault(); setMode("edit"); }
    else if (e.key === "c" || e.key === "C") openCompareDefault();
    return;
  }
  if (e.key === "ArrowRight") { go(st.cur + 1); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { go(st.cur - 1); e.preventDefault(); }
  else if (e.key === " ") { e.preventDefault(); togglePlay(); }
  else if (e.key === "c" || e.key === "C") openCompareDefault();
  else if (e.key === "1" || e.key === "2" || e.key === "3") { st.slot = ["first", "last", "video"][+e.key - 1]; st.vslot = null; render(); }
});
function setTheme(t) { document.documentElement.dataset.theme = t; try { localStorage.setItem("proto3-theme", t); } catch {} }

let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600); }

function render() { renderHeader(); if (isPage()) { P.hooks.page(st.mode); return; } renderLeft(); renderCenter(); renderRight(); renderStrip(); if (isList()) syncStrip(); }

const P = window.P = { hooks: {}, gear: () => "" };
Object.assign(P, { st, D, $, esc, render, renderCenter, renderRight, renderStrip, renderList, renderLeft, toast, startGen, regen, selCand, cur, statusOf, nextOf, lockSlot, unlockFirst,
  SLOT_NAMES, CHAR_NAMES, STATUS, placeholder, addCand, place, closeAll, setMode, isList, isPage, openCompare, openCompareDefault, closeCompare, dotHTML, groupLabel, showMenu, hue });
// URL params for screenshots: ?theme=light&view=edit&shot=3&tab=ver&real=1&left=0|1&open=2:first
const q = new URLSearchParams(location.search);
let saved = null; try { saved = localStorage.getItem("proto3-theme"); } catch {}
setTheme(q.get("theme") || saved || "dark");
if (q.get("left")) st.leftC = q.get("left") === "0";
$("#app").classList.toggle("lc", st.leftC);
if (q.get("real")) st.demo = false; else seedDemo();
if (q.get("shot")) st.cur = Math.max(0, Math.min(st.shots.length - 1, +q.get("shot") - 1));
if (q.get("tab")) st.rtab = q.get("tab");
if (q.get("open")) { const [i, p] = q.get("open").split(":"); st.open[+i - 1] = { p }; }
if (q.get("view") === "edit") { st.mode = "edit"; $("#app").classList.remove("listmode"); }
if (q.get("view") === "script" || q.get("view") === "api") { st.mode = q.get("view"); $("#app").classList.remove("listmode"); $("#app").classList.add("pagemode"); }
if (q.get("slot")) st.slot = q.get("slot");
P.q = q;
window.addEventListener("DOMContentLoaded", () => { P.hooks.init?.(); render(); P.hooks.after?.(); });
})();
</script>
<script src="ext.js"></script>
</body>
