    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#15171c"/>
  <rect x="12" y="11" width="18" height="32" rx="4" fill="url(#g)"/>
  <rect x="34" y="21" width="18" height="32" rx="4" fill="url(#g)" opacity=".55"/>
