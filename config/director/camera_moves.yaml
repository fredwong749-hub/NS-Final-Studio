# 运镜词表（单一事实来源；DIRECTOR，总调度 fredw-2b 派 L-107，2026-11-02）
# 项目方 11-02 03:1x 原话：“我发现了一些 AI 的运动镜头，需要你把这些内容放到镜头的提示词里面去……1. 让 Master Agent、剧本 Agent
# 和导演 Agent 学会这个事情，并写到本地规则里。2. 在 Season 2 里面，可以把这些内容写进去。”
# 资料：docs/reference/camera_moves_20261102.md（项目方粘贴的“AI 视频运镜指令大全”，适配 Runway / 可灵 / 剪映）。
# 本项目视频模型是 Pika Flex：每种运镜在 Pika 上 A/B（data/ab/video_rca/cm_r1/，2 seed，判据见 ab_criteria），
# 通过的才 enabled: true；没过 / 没测的 enabled: false 并写原因。K-REN-801 / K-EDT-811 / camera_norm / cut_plan 都读本文件，不再写死。
# 读写：services/agent/ns_agent/camera_vocab.py（load / match / clause / enabled_ids）。改这里要同步跑 tests/test_director.py。
schema: nsfs.camera_moves/1
version: cm-v1-2026-11-02
ab_criteria:
  doc: 每种运镜在同一镜（ep10-S2 中景单人坐姿，S★ R0 首帧）上只换运镜句，2 seed；全部满足才 enabled
  rules:
    - {id: AB1, text: "成片运动项：score_clip mean ≥ 0.5（不站桩）且无镜内硬切（cuts = 0）"}
    - {id: AB2, text: "面部稳定：林晚 SFace 中位 ≥ 0.30 且 p10 ≥ 0.25（与基线 static 同口径）"}
    - {id: AB3, text: "无分身 / 多肢：V6 dup_side_frac ≤ 0.15 且 extra_hand_frac ≤ 0.05 且 people 与首帧一致"}
    - {id: AB4, text: "J4 去抖后可用：J4 ≤ 1.3 或 J4_z < 3（> 则记‘4 帧一顿’软项，由 dejudder 处理，不单独否决）"}
    - {id: AB5, text: "景别不跑档：size_measured 与首帧景别差 ≤ 1 档（Pika 本身会往远退，RCA_r1 C16）"}
  seeds: [20261102, 20261103]
  shot: ep10-S2
constraints_en: >-
  Her face stays stable and sharp throughout, with no clipping through objects, no duplicate people, and no on-screen text or watermark.
constraints_zh: 人物面部稳定、无穿模卡顿、禁止分身、无字幕水印
# amp：只用 small（K-PRM-101 / Pika P16）；speed 词一律不写（项目方：节奏慢）；dir 由导演层按视线 / 站位给 left|right
moves:
  - id: static
    zh: 固定镜头
    en: Static Shot
    aliases: ["固定镜头", "固定机位", "static shot", "static camera", "static", "fixed camera", "机位固定"]
    template: "The camera holds a static shot"
    params: {lens: "35mm", aperture: "T1.4–T2.8"}
    sizes: [特写, 近景, 中近景, 中景, 中全景, 全景]
    moods: [对白, 克制, 停顿, 大动作]
    conflicts: []
    split: null
    enabled: true
    ab: {status: baseline}
    reason: 基线（现行 25 镜用它）
  - id: push_in
    zh: 推近
    en: Dolly In
    aliases: ["推近", "推镜", "缓慢推近", "小幅推近", "镜头缓推", "缓缓推近", "push in", "push-in", "dolly in"]
    template: "The camera pushes in with small amplitude"
    params: {lens: "50mm"}
    sizes: [近景, 中近景, 中景, 中全景]
    moods: [情绪推高, 发现, 高点]
    conflicts: [arc, zoom_in, pull_out]
    split: null
    enabled: true
    ab: {status: baseline}
    reason: 基线（现行 60 镜用它；Pika P16 推近只写小幅）
  - id: pull_out
    zh: 拉远
    en: Dolly Out
    aliases: ["拉远", "缓慢拉远", "后拉", "pull out", "pull-out", "dolly out", "pulls out"]
    template: "The camera pulls out with small amplitude"
    params: {lens: "35mm"}
    sizes: [近景, 中景]
    moods: [疏离, 收尾]
    conflicts: [push_in, arc, zoom_in]
    split: null
    enabled: false
    ab: {status: pending}
    reason: 待 A/B；现行依据 RCA_r1 C16（视频比首帧再远 ≥1 档 11/55），拉远会叠加退档
  - id: pan
    zh: 摇镜（水平）
    en: Pan
    aliases: ["摇镜", "横摇", "左摇", "右摇", "pan left", "pan right", "pan"]
    template: "The camera pans {dir} with small amplitude"
    params: {}
    sizes: [中景, 中全景, 全景]
    moods: [交代空间, 视线引导]
    conflicts: [truck, arc]
    split: null
    enabled: false
    ab: {status: pending}
    reason: 待 A/B
  - id: tilt_up
