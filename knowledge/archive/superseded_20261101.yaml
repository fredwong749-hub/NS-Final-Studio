    domain: edit
    link: [P4-P9, P8-P9]
    title: 旁白 / 独白要有独立 narrator 音色：年轻都市感、语速自然、时长不超过所在镜
    when: 合成独白（🎙）或旁白音轨
    then: 每个有独白的角色要有独立的 narrator 音色（不复用对白音色、不放慢）；听感年龄与人物表 age 一致、年轻都市感、自然语速；独白时长 ≤ 所在镜长 − 0.3 s（SS-A4）。具体音色由项目方在试听候选里挑定后再写入 config/voices.json（未挑定前这一项是项目方闸门）
    targets: [{kind: writer_prompt, section: 身份锚点}, {kind: director_prompt, section: 判定标准}]
    writer_text: 有独白的角色，人物表 VOICE 短语写明年龄段（例 a young woman in her early twenties）、都市感和自然语速；独白长度放得进所在镜头（≤ 镜长 − 0.3 秒，放不下就拆镜）。
    director_text: 旁白 / 独白听感明显比人物老（差 10 岁以上）、或语速拖沓 → fail，action=owner，issues 写“旁白音色（P4-P9，待项目方挑音色）”。
    evidence:
