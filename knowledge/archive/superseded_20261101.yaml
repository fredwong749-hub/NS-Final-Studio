  - id: K-REV-X01
    _from: knowledge/rules/research_realism.yaml
    _archived_reason: "⤴ 不采纳：L-087 项目方选 R0（11-01 17:5x“……都非常满意……很棒哎!”），MASTER_PICTURE §1 L-087"
    domain: review
    link: P5-P6
    title: ⤴（项目方选 R0，不采纳）契约 Q4 的整图 Laplacian 在锐化后的交付图上测，测到的主要是 USM，不是皮肤质感
    when: 用 lap_full（或任何整图 / 区域 Laplacian、高频能量）判首帧“塑料 / 糊”，而交付图做过 UnsharpMask
    then: >-
      ⤴ 项目方 11-01 确认现行 S★（选 R0），本条建议不采纳（L-087）。项目方原话（11-01 17:5x，总调度转）：“realism_ab……这个版本出来的东西,无论是画面效果还是颜色,都非常满意……很棒哎!”，随后 AskUserQuestion 选“R0 现在这样”（保持现行强锐化）。现行 USM 1.2/60/2、S★ 后缀（含“焦点锐利 / 暖调”）、系统规格句、契约 Q4 口径全部不改；本条只作研究记录，不作为改动依据。
      同一张生产原图只去掉 frame_v9 的 USM（1.2 / 60% / 2），lap_full 降到原来的 48–49%：ep01-S1 235.7→112.4、S2 187.2→90.6、S5 200.0→98.8，
      3/3 从过线（≥175）变成不过线；“塑料娃娃脸”探针 p_plastic 三档都是 0.999 以上，没有变化。leica_sharp 旧图（ep02 三镜）Sstar_g→Sstar 同样 ×2.05–2.14。
      所以 Q4 线 175 实际在判“有没有锐化”，这也解释了 K-REV-B02 留出集 AUC 只有 0.41。
      做法：质感指标在未锐化的图上测（raw 缩回、不做 USM），或者只看脸部指标；任何新的质感阈值，标定集和被测图必须是同一条后处理。
      改契约口径归 REFLOCK / 总调度。
    evidence:
      - {src: data/ab/realism_ab/metrics.json, note: R0 / R1 / R2 三档 lap_full、halo、face_hf、p_plastic}
      - {src: docs/research/realism_tuning_20261101.md, note: §三}
      - {src: config/gen_contract.json, note: image_thresholds.Q4_texture lap_full_min 175}
    check: tests/test_realism_lint.py::test_usm_alone_inflates_q4_laplacian
    confidence: high
    status: 项目方闸门
    date: 2026-11-01
  - id: K-REN-X02
    _from: knowledge/rules/research_realism.yaml
    _archived_reason: "⤴ 不采纳：L-087 项目方选 R0"
    domain: render
    link: P5-P6
    title: ⤴（项目方选 R0，不采纳）塑料感不是锐度问题：不要再加锐化或锐度词来救“塑料脸”，现在已经是三重锐化
    when: 首帧被说塑料 / 娃娃脸 / 不像真人，想通过加锐化、加“焦点锐利 / 五官锐利 / 皮肤纹理清晰”解决
    then: >-
      ⤴ 项目方 11-01 确认现行 S★（选 R0），本条建议不采纳（L-087）。项目方原话（11-01 17:5x，总调度转）：“realism_ab……这个版本出来的东西,无论是画面效果还是颜色,都非常满意……很棒哎!”，随后 AskUserQuestion 选“R0 现在这样”（保持现行强锐化）。现行 USM 1.2/60/2、S★ 后缀（含“焦点锐利 / 暖调”）、系统规格句、契约 Q4 口径全部不改；本条只作研究记录，不作为改动依据。
      实测 USM 让边缘过冲（halo）增加 53–71%，发丝和下颌出现白边，但塑料脸探针不变；社区对重度 USM 的评价是“sharpened to death”“even more fake”。
      现行链已经叠了三层锐化：系统规格句“面部清晰对焦，五官锐利”、风格后缀“焦点锐利，微反差强，皮肤纹理清晰”、后处理 USM（RL01：80/80 条首帧作业命中）。
      不再往上加。要改善真人感，从生成端下手：写实 LoRA 的数据来源（真实照片 vs 生成图）、提示词去助推词并把光写具体、参考写法（K-PRM-Q26）、出图尺寸（K-REN-Q27），每项先 A/B。
      USM 本身是项目方 10-31 选定的 S★（“leica_sharp 效果最好”），减弱或关掉要项目方看 R0 / R1 / R2 后决定。
    evidence:
      - {src: data/ab/realism_ab/metrics.json, note: halo R0 2.83–3.45，R1 1.66–2.26}
      - {src: docs/research/realism_tuning_20261101.md, note: N8、N9}
      - {src: data/ab/realism_ab/lint_scan.json, note: RL01 80/80}
    check: tools/research/realism_lint.py
    confidence: medium
    status: 项目方闸门
    date: 2026-11-01
