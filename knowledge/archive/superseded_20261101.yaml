    _from: knowledge/rules/research_realism.yaml
    _archived_reason: "⤴ 不采纳：L-087 项目方选 R0"
    domain: prompt
    link: P4-P6
    title: ⤴（项目方选 R0，不采纳）风格后缀固定写“暖调”，和本镜正文的冷色主光打架（35/80 条）
    when: 编译首帧提示词时接风格后缀（S★ 后缀“…暖调通透…”）
    then: >-
      ⤴ 项目方 11-01 确认现行 S★（选 R0），本条建议不采纳（L-087）。项目方原话（11-01 17:5x，总调度转）：“realism_ab……这个版本出来的东西,无论是画面效果还是颜色,都非常满意……很棒哎!”，随后 AskUserQuestion 选“R0 现在这样”（保持现行强锐化）。现行 USM 1.2/60/2、S★ 后缀（含“焦点锐利 / 暖调”）、系统规格句、契约 Q4 口径全部不改；本条只作研究记录，不作为改动依据。
      series10 80 条首帧作业里 35 条正文写了冷白顶光 / 冷光 / 偏冷，后缀却固定“暖调”。官方改写器的结构是“单独一句写光线”，同一句里不出现两套色温。
      建议：后缀不写色温，色温只由本镜光线句决定；或者编译器检测到正文冷色主光时去掉后缀里的“暖调”。
      后缀是项目方选定的 S★ 原文，改动交总调度；改前先跑 A/B（gpu_plan.json G1 或 BAKEOFF qa_suffix）。
    evidence:
      - {src: data/ab/realism_ab/lint_scan.json, note: RL02 35/80}
      - {src: docs/qwen21/RESEARCH.md, note: 结论 17}
