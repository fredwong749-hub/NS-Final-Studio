# 总调度 11-01 晚：K-REN-X03 没有真正的检查，从 knowledge/rules/research_realism.yaml 移进 inbox（RSI 代移）；RESEARCH 补检查后再收编。
rules:
  - id: K-REN-X03
    domain: render
    link: P5-P6
    title: 真人写实 bad case 目录（Qwen-Image 2.1）：现象 → 原因 → 我们的状态
    when: 看到首帧皮肤 / 边缘 / 纹理异常，先对照这张表找原因
    then: >-
      1）⤴ 发丝、下颌边缘的锐化白边：现行 USM 1.2/60/2 的固有效果；项目方 11-01 17:5x 看过 R0/R1/R2 选 R0（“画面效果还是颜色,都非常满意”，L-087），不算坏例、不处理。
      2）皮革感、颗粒：在 Turbo checkpoint 上再叠 Viggle / Pruna 之类加速 LoRA（社区作者原话 “leathery skin and grit”）；我们没叠，保持。
      3）画面发“砂”、发糊：Turbo 没用官方 8 个 sigma，改成普通 KSampler 8 步（社区 “came out gritty”）；我们用官方 ManualSigmas，保持。
      4）凭空出毛孔、雀斑、胡茬，脸显老：用 Qwen 自己做放大 / 重绘（“The upscale is a redraw”）；定稿档第二遍 denoise 0.30 有这个风险，恢复定稿档时考虑 Restore LoRA。
      5）细棋盘格：原版 VAE（我们已换 texture_fix）；紫绿竖条：分块 VAE 解码（不要开）。
      6）鼻额油光：强光近景（厂商横评，低置信）；我们 face_oil 实测 ≈0，暂不处理。
      7）淡淡的第二个人影：社区 4 步加速 LoRA 路线用 simple 调度时出现、beta 没有（单作者）；我们不走这条路线，只记录。
      8）塑料娃娃脸（大眼、磨皮、腮红重）：锐化三档都不改变，属生成端问题；GPU 档 G1 / G2 已因项目方选 R0 取消（L-087），不再按此改。
    evidence:
      - {src: docs/research/realism_tuning_20261101.md, note: N1–N7}
      - {src: docs/qwen21/RESEARCH.md, note: 结论 13、19、20}
      - {src: data/ab/realism_ab/metrics.json}
    check: 做不成自动检查：多数条目是“不要这样配”的配置约束，已由现行配置满足（第 2、3、5 条可由 tools/bakeoff/run.py 与 ns_render.workflows 的固定值保证）；第 1 条由 RL01 / K-REV-X01 覆盖
    confidence: medium
    status: 确认
