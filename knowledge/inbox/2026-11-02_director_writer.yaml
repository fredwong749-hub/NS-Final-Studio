# DIRECTOR loop（总调度 fredw-2b 派，2026-11-02）写作格式草案：导演层 / 后期层要读的字段怎么写。只讲格式和 Pika 可实现性，不写剧情。
# lint：tools/director/cut_plan.py lint（现行 10 集 54 条，11-02 实测）。确认后由 RSI / HOLLYWOOD 收编进 knowledge/rules/writer*.yaml。
rules:
  - id: K-WRT-801
    domain: writer
    link: P3-P4
    title: motion 第一句写一种运镜 + 幅度，不写速度；不用拉远 / 环绕 / 晃动
    when: 每镜 motion
    then: 运镜只用 static / push in / truck / pan / tilt / pedestal，幅度写“小幅 / 中幅”；不写“缓慢 / 缓缓”；不用 pull out（拉远）、arc（环绕）、shake
    targets: [{kind: writer_prompt, section: 镜头字段}]
    writer_text: motion 第一句写一种运镜加幅度（例：camera push in 小幅推近），不写“缓慢”这类速度词；不用拉远、环绕、晃动——Pika 本来就会往远退，环绕和大动作叠在一起会变形。
    evidence:
      - {src: config/prompts/hollywood_pika_reference.md P3 P16}
      - {src: tools/director/cut_plan.py lint, note: "现行剧本“缓慢推近”48 镜"}
    confidence: medium
    status: 建议
    date: 2026-11-02
  - id: K-WRT-802
    domain: writer
    link: P3-P4
    title: 衔接写“接力”时必须写接什么（动作 / 视线 / 环境 / 位置）
    when: 每镜衔接字段
    then: link_carry = 动作｜… / 视线｜… / 环境｜… / 位置｜…；导演层据此定动作匹配切 / 视线匹配切
    targets: [{kind: writer_prompt, section: 镜头字段}]
    writer_text: 衔接写“接力”时，后面写清接的是什么：动作｜具体动作、视线｜看向哪、环境｜什么声音或光、位置｜站位；剪辑按它决定动作匹配切还是视线匹配切。
    evidence:
      - {src: knowledge/rules/writer_camera.yaml K-EDT-102}
    confidence: medium
    status: 建议
    date: 2026-11-02
  - id: K-WRT-803
    domain: writer
    link: P3-P4
    title: 每镜【配乐】写“强度 0–3”，整集至少两档，高点镜写 3
    when: 每镜【配乐】
    then: 导演层按强度定刀长（K-EDT-813），配乐按强度起伏（K-EDT-804）
    targets: [{kind: writer_prompt, section: 声音字段}]
    writer_text: 每镜【配乐】都写“强度 0–3”；一集里强度至少有两档，情绪最高的那一镜写 3——剪辑节奏和配乐起伏都按这个数走。
    evidence:
      - {src: data/film_score/ep01_v2.json S3.4, note: "BGM 时间轴强度全是 2"}
    confidence: medium
    status: 建议
    date: 2026-11-02
