# VIDEO-RCA 草案 K-WRT-702，RSI r7 收编（lint QW-W11）
rules:
  - id: K-WRT-702
    domain: writer
    link: P3-P4
    title: 分拍里不写“对身上正穿着的衣服做动作”（整理 / 抚平 / 拉 / 收紧 / 掀起外套、衣摆、衣领）——视频模型会演成脱下再穿上
    when: 写 H3 正文分拍（At 00:0X），在画人物穿着外套 / 西装 / 大衣 / 裙子等
    then: 想表达“整理仪容 / 镇定下来”，写成不碰衣服的身体动作（手放下、深吸气、肩膀放松、看向某处）；确需穿脱衣物的情节单独成镜，并在首帧 / 尾帧里把穿脱前后都画出来（交写作方，系统不改正文）
    writer_text: "分拍动作不要写对身上正穿着的衣服的整理动作（抚平外套下摆、拉衣角、收紧衣领等）：视频模型会把外套先脱掉再穿回。想表达整理 / 镇定，写不碰衣服的动作，例如手放回身侧、深吸一口气、肩膀放松。"
