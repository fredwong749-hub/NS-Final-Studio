    domain: asset
    link: P5-P6
    title: 出图必须引用造型与单品资产图——服装 / 鞋 / 饰品不得只靠文字
    when: 任何首帧 / 尾帧 / 改图出图（Qwen-Image 2.1、Qwen-Image-Edit 2511、Klein / FLUX.2），镜头里有已登记造型的角色
    then: 参考图由 ns_agent.asset_refs.resolve_shot 解析——身份脸（脸可见时）+ 本镜造型设定图（特写 / 近景半身栏、中景及更远正面全身栏）+ 景别可见单品（K-REN-101；鞋可见时鞋最先；局部特写只取该局部）+ 场景；单品图来源 = 衣橱产品图 > 设定图裁切（标“仅设定图”）> 都没有 = 资产缺图，阻断出图并在资产中心提示；提示词逐张写“图N是她这一镜穿的X，必须完全一致（款式、颜色、材质、细节）”
    writer_text: 每镜的服装、鞋、饰品写法要和本集“造型｜角色”行一致；手里拿着的道具写清“拎着 / 捧着”，不要写成穿在身上。
    evidence:
      - {src: data/pipeline/runs/series10_v1/assets/first_frame_jobs.json, note: "改前 80 条首帧作业只挂脸部裁切（refs 只有 face_ref2va / sheet2），服装 / 鞋 / 饰品全靠文字；项目方：“不同地方的鞋子都不一样”"}
