# REFLOCK（2026-10-31 ~ 11-01）：资产参考锁定 + 生成契约（docs/GEN_CONTRACT.md）的代码化规则与阈值。
# 代码：services/agent/ns_agent/asset_refs.py、services/agent/ns_agent/gen_contract/、tools/gen_contract/*。
# 起因（项目方原话）：“关于女主角鞋子的一致性也全部错了，不同地方的鞋子都不一样，说明你没有做到 reference 的做法……
# 你要在 image 里面让它知道，这个女孩要穿这个鞋子、穿这个衣服、戴这个饰品等等，然后才能锁定一致性。”
