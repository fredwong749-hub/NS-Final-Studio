# NETFIX 11-01（总调度 fredw-2b 派；项目方 22:1x 原话：“gpu连接是大问题,现在全部修复连接问题”）
rules:
  - id: K-OPS-N01
    domain: ops
    link: [P5-P6, P7-P8]
    title: 笔记本全部端口转发只由一个监管进程负责（每台服务器一条 ssh 挂多个 -L，指数退避，跳板恢复立刻重连）；看门狗只探测和报警
    when: 笔记本经跳板 194relay 连 gpu33 / gpu36 的任何端口转发（ComfyUI 出图 / 视频道、画布桥、信箱）
    then: tools/netfix/tunnel_supervisor.py（config/netfix/tunnels.json）单实例常驻；ssh 带 ConnectTimeout / ServerAlive（ProxyCommand 那一跳也带）和 Tag=nsnetfix-<host>，监管进程重启按 Tag 认领不打断；跳板 TCP 不通不起 ssh，恢复即退避清零；探测全部超时连续 3 轮（20 s 超时）才判卡死，个别口“对端拒绝”只记 remote_down 不杀；占口但不带 Tag 的 ssh、旧 tunnel*.sh 循环一律接管（杀掉）；不许再手动起 -L ssh、不许另写重连循环。保活 = 计划任务 NS-Studio-TunnelSupervisor 每 5 分钟 ensure + laptop_autostart.ps1 ensure。infra_watchdog 在监管心跳 ≤ 90 s 时不修，过期报 A-SUPERVISOR 并兜底。Git for Windows 的 ssh 不支持 ControlMaster（11-01 实测 mux reset），不要用
    check: tests/test_netfix.py
    evidence:
      - {src: data/netfix/inject/20261101_224035.json, note: "注入（定稿参数 20 s×3 轮）：杀 ssh 18.4 s、挂起 ssh 98 s、孤儿占口 22.4 s、跳板断 90 s 期间不起 ssh、恢复后 14.0 s 6/6（验收 ≤ 60 s）；前一版参数 20261101_222625 同为 14 s"}
      - {src: docs/overnight/OFFLINE_20261101.md, note: "22:08 gpu36 三条全断、跳板通：循环不在，看门狗只杀 ssh 永远修不好"}
    confidence: high
    status: 确认
    date: 2026-11-01
  - id: K-OPS-N03
    domain: ops
    link: [P7-P8]
    title: gpu33 看图走 gpu36 内网入口 10.0.0.36:8870（只听内网、只认 10.0.0.33），不经跳板、不配两台服务器 ssh 互信
    when: 服务器常驻 producer 在 gpu33 上需要 Q9 本地看图
    then: gpu36 上 /root/work/fredw/netfix/lan_proxy.py 只监听 10.0.0.36:8870、来源白名单 10.0.0.33、转 127.0.0.1:8870（看图服务本身仍只听 127.0.0.1，不重启）；ns_agent.vqa.client._lan_url 只在服务器（OFFLINE_SELF）上、只认 config/vqa.json model.lan_url 的 10. 内网地址；保活挂 resident_sync health 拍（bash lan_proxy.sh，幂等），不用 crontab；iptables 不加（gpu36 只有一块内网网卡 eno3 10.0.0.36/21，总调度 22:3x 定）
    check: tests/test_netfix.py::test_vqa_lan_url_only_on_servers
    evidence:
      - {src: tools/netfix/lan_proxy.py, note: "11-01 22:2x gpu33 curl 10.0.0.36:8870/health HTTP 200 0.05 s；client 真实请求回 '1'（37.4 s）；gpu36 自己连内网地址被 DENY"}
    confidence: high
    status: 确认
    date: 2026-11-01
  - id: K-OPS-N04
    domain: ops
    link: [P5-P6, P7-P8]
    title: 每台机器只派本机的出图道；谁派哪些镜由 config/netfix/partition.json ∩ ready_episodes.json 算（tools/netfix/dispatch.py），不手写 control.only
    when: 出图派单（服务器常驻 producer + 笔记本 producer）
    then: only = partition.images[本机] ∩ data/autopilot/ready_episodes.json 的镜（交集空 = ["__none__"]，绝不留空——空 only 等于全派）；hold_lanes = 别机的道（服务器上也挂 laptop:0）；服务器 paused 跟随笔记本 control.json 全局暂停（快照 data/netfix/laptop_ctrl.json，缺快照按暂停）；分区按集互斥（dispatch.py check），视频 laptop 不分；跨机接手（work stealing）没有共享锁不做，见 dispatch.steal_plan
    check: tests/test_netfix.py::test_no_two_producers_share_a_shot_or_lane
    evidence:
      - {src: config/netfix/partition.json, note: "总调度 22:2x：gpu33=[1,3,5,7]、gpu36=[2,4,6,8,9]、laptop=[10]（离线那次 3 对 7 不均；笔记本 4080 也要跑）"}
    confidence: medium
    status: 确认
    date: 2026-11-01
  - id: K-OPS-N05
    domain: ops
    link: [P7-P8]
    title: 连接 / 自主生产状态只有一个数据源 data/netfix/net_status.json（监管进程每 5 s 写），界面和看门狗读它，不在请求里 ssh
    when: 界面显示跳板 / 隧道 / 服务器自主生产状态（UIRSI r38）
    then: 字段见 tunnel_supervisor.STATUS_DOC（relay.up / down_since_t、hosts.<h>.state / ports / restarts、tunnels_up / total、servers.<h>.last_pull_t / autonomous）；t 超过 90 s 没更新 = 监管进程不在
    check: tests/test_netfix.py::test_status_doc_fields
    evidence:
      - {src: tools/netfix/tunnel_supervisor.py, note: "STATUS_DOC"}
    confidence: medium
    status: 确认
    date: 2026-11-01
  - id: K-OPS-N06
    domain: ops
    link: [P5-P6, P7-P8]
    title: 服务器资产没到位时，由笔记本临时代派（经隧道）；逐台交还走 laptop → draining → server 两阶段，任何时刻同一集只有一个 producer 派
    when: 服务器常驻 producer 被 preflight（缺设定图 / refcrops / 单品图）整批挡下，而笔记本资产齐全
    then: config/netfix/override.json active=true；data/netfix/override_state.json 每台 phase；开启顺序 = 先把服务器 server-control 写成 only=__none__ 并确认 inflight=0、无租约，再 reconcile 放开笔记本（only = 笔记本分区 ∪ phase=laptop 的服务器分区，hold 只挂 override.laptop_hold）；交还 = data/autopilot/assets_ready.json <host>.ready=true → draining（笔记本去掉该台集 + hold 该台道）→ 笔记本在该台集上的租约全部结束 → server。监管进程 30 s 一次 dispatch.reconcile()；net_status.dispatch_mode 显示。隧道卡死判定看 ssh 进程读写字节：在搬数据就不是卡死（跳板慢时不许杀正在传图的隧道）
    check: tests/test_netfix.py::test_reconcile_hands_back_only_after_assets_ready_and_leases_done
    evidence:
      - {src: data/producer/log.jsonl, note: "23:43:52 覆盖生效后笔记本第一单 first:ep01-S1 → gpu33:1，23:45:45 rendered；23:44:37 监管重载一轮探测超时误杀 gpu36 隧道 → ep01-S2/S3 两次 infra_error（已改：认领按通算 + 读写字节判活）"}
    confidence: medium
    status: 确认
    date: 2026-11-01
  - id: K-OPS-N07
    domain: ops
    link: [P5-P6, P7-P8]
    title: 到跳板只保持固定的常驻连接池（6 条道隧道 + 每台 2 条 WSL 命令主连接），远程命令只许复用、不许每次新建 ssh；新建握手全局同时 ≤2
    when: 笔记本任何程序要对 gpu33 / gpu36 跑远程命令或传文件
    then: 用 tools/netfix/rssh.run（或直接起 ssh——笔记本 venv 的 .pth 加载 tools/netfix/ssh_shim.py，自动改写为 wsl --exec ssh -S <主连接> -o ProxyCommand=false，主连接不在立刻失败、不新握手）；主连接由 tunnel_supervisor 托管（config/netfix/tunnels.json kind=wsl_mux，每台 2 条，服务器 sshd MaxSessions 10 → 随机分摊），新建连接 max_connecting=2（跳板 MaxStartups 10:30:100）；新增直接起 ssh 的文件必须登记 config/netfix/ssh_callers.txt；安全阀 NS_SSH_SHIM=off；服务器 venv 不装 shim；Windows→WSL 的 127.0.0.1 端口转发在 NAT 模式下不通（实测），所以道隧道仍走 Windows 侧常驻 ssh
    check: tests/test_netfix.py::test_no_new_direct_ssh_outside_allowlist
    evidence:
      - {src: data/netfix/conn_watch.jsonl, note: "00:07 总调度实测：26 个 ssh.exe、到跳板 ESTABLISHED 13 / TIME_WAIT 12；改后见 conn_watch 30 分钟统计"}
      - {src: tools/netfix/rssh.py, note: "00:26 复用连接执行命令 0.9–2.0 s（原每次 6–7 s 握手）；00:31 单主连接并发 >10 会话报 Session open refused by peer → 每台 2 条"}
    confidence: medium
    status: 确认
    date: 2026-11-02
  - id: K-OPS-N08
    domain: ops
    link: [P5-P6, P7-P8]
    title: 到服务器主路走香港中转 hkjump → 194relay（域名）→ gpu，直连作备用；用项目 ssh 配置 config/netfix/ssh_config（-F，相对路径 + cwd=ROOT）和项目 known_hosts，不改用户 ~/.ssh/config
    when: 监管进程起任何隧道 / 命令主连接
    then: routes = hk（入口 47.243.63.181:22，主机名加 -hk）/ direct；hk 入口不通或连续 4 次连不上 → 判坏 10 分钟走直连；主路稳定 120 s 后逐条迁回（每拍最多一条，不全局停）；hkjump 只认 id_ed25519_gpu36；194relay-hk 的 HostName 必须是域名 sz194.instameta.org（写 IP 会被拒绝转发）；hkjump 指纹 SHA256:IrIRIa+ucfx1CxhkWG4lEsDI58vb1EZ03/rOR7uPHtY（总调度 11-02 00:5x 用 ssh-keyscan 核对，与项目方文档一致，记入 config/netfix/known_hosts）；路径含空格，-F 一律用相对路径并设 cwd=ROOT
    check: tests/test_netfix.py::test_ssh_cmd_has_keepalive_and_tag
    evidence:
      - {src: data/netfix/bw_test.jsonl, note: "gpu36-hk：上传 1 条 2.9 MB/s、4 条 5.5 MB/s；下载 1 条 1.5 MB/s、4 条 1.55 MB/s（直连：上传 1 条 36 KB/s、下载 53 KB/s）"}
      - {src: data/netfix/supervisor.log, note: "01:03–01:08 14 条常驻连接全部滚动迁到 hk，没有全局停产"}
    confidence: medium
    status: 确认
    date: 2026-11-02
