# DISTILL 11-02（总调度 fredw-2b 派；L-102 / ITERATION_PROTOCOL §G1）：把总调度和各 agent 的判断提炼成代码策略、规则、编排器
# 项目方原话（11-02 01:4x）：“所有的 learning 规则都要写到这个系统里，后面就不用 Claude 来指引整个事情了……所有工作尽量写成一个代码库，来 monitor 整个 process”
rules:
  - id: K-OPS-X01
    domain: ops
    link: [P5-P6, P7-P8, P10-P11]
    title: 阈值和判断的单一来源是 config/policies/*.yaml；代码里另有常量的项由 policy_check 逐项比对，不一致即不通过
    when: 任何 loop 新定或修改一个运行期阈值 / 判断（GPU 分工、积压闸、暂停时限、交还条件、预算、重试次数、阻断项、发版条件）
    then: 先改 config/policies/<域>.yaml 对应项（value + source 出处 + enforced_by + status），代码直接读（status=code_reads）或写 drift 规则（status=drift_checked）；pending 项必须写 plan；改完跑 run.py policy-check 退出码 0
    check: tests/test_distill_flow.py::test_policy_drift_clean, tests/test_distill_flow.py::test_policy_refs_exist, tests/test_distill_flow.py::test_drift_detects_change
    evidence:
      - {src: config/policies/resources.yaml, note: "11-02 首次比对即发现 config/vqa.json model.instances 已被 VQAGATE 改为 4，而积压闸说明仍写 1；漂移检查把它暴露出来"}
    confidence: high
    status: 确认
    date: 2026-11-02
  - id: K-OPS-X02
    domain: ops
    link: [P4-P5, P5-P6, P7-P8, P9-P10, P10-P11, P11-P12]
    title: 剧本导入后的全部环节由 tools/autopilot/flow.py 一个编排器现推状态、标 decider、列卡点；各 loop 的工具接到它的段上，不另起入口
    when: 新增或改动生产链路中的任何一段（作业、首尾帧、看图闸门、视频、视频检测、合成、后期、成片分、交付）或其中的判断点
    then: 在 flow.STAGES 对应段登记判断点 {what, now, target, ref, plan}（now/target ∈ code | local_model | api_model | owner | claude）；now=claude 必须写 plan；run.py coverage 重新生成 data/autopilot/coverage.json；界面读 data/autopilot/flow/status.json
    check: tests/test_distill_flow.py::test_stage_points_complete, tests/test_distill_flow.py::test_status_all_on_fixture, tests/test_distill_flow.py::test_coverage_counts
    evidence:
      - {src: tools/autopilot/run.py, note: "10-31 的 P5-P10 走 iterate_loop，实际生产已是 producer → VQA → night → finish；旧 dry-run --auto-approve 10/10 全过（假绿），新编排器冷启动演练找出 16 个断点"}
    confidence: high
    status: 确认
    date: 2026-11-02
  - id: K-OPS-X03
    domain: ops
    link: [P5-P6]
    title: 系统或 agent 暂停 producer 超过 resources.pause_max_s（180 s）即为事故——检测、报警，经授权后自动恢复；项目方本人暂停不受限
    when: control.json paused=true 且 paused_by 不是项目方
    then: run.py guard 每拍检测，超时写 data/qa/alerts.jsonl（A-PAUSE-OVERDUE）；--apply 时经 producer.set_paused 恢复（by=POLICY_GUARD，审计进 producer log）；切线路 / 重启只许滚动、按道排空
    check: tests/test_distill_flow.py::test_pause_overdue
    evidence:
      - {src: docs/overnight/morning_20261102.md, note: "11-02 00:52 NETFIX 切线路全局 pause，12 分钟未恢复，GPU 只有一张在忙；总调度 01:04 手动 resume 并定“暂停 ≤3 分钟自动恢复”"}
    confidence: high
    status: 确认
    date: 2026-11-02
