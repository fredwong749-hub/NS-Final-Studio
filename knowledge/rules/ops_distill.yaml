  - id: K-OPS-X06
    domain: ops
    link: [P4-P5, P5-P6]
    title: data/ 里的决策 / 配置类文件不进 git，每次 system_version cut 打快照（tar + 逐文件 sha256 manifest），回滚一起恢复；新剧本从 config/ 默认值生成
