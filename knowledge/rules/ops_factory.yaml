# FACTORY 11-02（总调度 fredw-2b 派；L-099 / L-099b；项目方 11-02 01:1x 原话：“单独写个 Agent，在服务器的 GPU 上写代码，把我们遇到的慢连接、断连一大堆的问题，在那边把系统的 framework 重新 reframe 一下，看怎么样做得更好”）
# 服务器是工厂、笔记本是控制台。方案：docs/master/FRAMEWORK_REFRAME.md（方案 C，D1–D10）。代码：tools/factory/。
rules:
