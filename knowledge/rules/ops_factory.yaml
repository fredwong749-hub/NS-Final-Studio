    then: 道地址只用本机 127.0.0.1 ComfyUI（D1）；远程命令经 tools/netfix/rssh.py 常驻主连接；超过 2 分钟的远程任务用 setsid nohup 在服务器后台跑、结果写服务器文件，笔记本每 15 s 短查一次（主连接抖动不打断任务）
    check: tests/test_factory.py::test_factory_has_no_tunnel_ports
    evidence:
      - {src: data/producer/log.jsonl, note: "11-01 20:00 后经隧道派单：gpu33 墙钟 p50 109.2 s / GPU 38.0 s（18 单），gpu36 136.4 s / 36.7 s（12 单）；11-02 01:24 后服务器本机出图 render_s p50 39.8–43.9 s"}
      - {src: docs/master/FRAMEWORK_REFRAME.md, note: "P1–P6；11-02 01:34–01:44 跳板主连接三次断开（Connection closed by UNKNOWN port 65535），同步挂着等的 sync verify 两次失败，改后台 + 短轮询后完成"}
