    title: 发版冻结窗口：cut 开始写 data/system_versions/cut_lock.json，先把工作树冻结成一棵 git 树并导出快照，所有闸门对快照跑，提交冻结树；cut 期间别人的改动只进下一版；pytest 收集错误报出具体文件
