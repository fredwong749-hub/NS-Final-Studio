    title: ComfyUI 一律用 --cache-ram（门槛 = 剩余内存 GB），不用 --cache-none
    when: 启动 / 重启任何一道 ComfyUI（gpu33 ns-comfy@、gpu36 comfy.sh、lane.sh normal）
    then: gpu33 用 --cache-ram 64 96（systemd drop-in 10-infra-ram.conf）；gpu36 用 --cache-ram 56 88。两个数是“系统剩余可用内存”的门槛，不是缓存大小（140 200 等于只用一半内存）。缓存上限约 80–87%，由 memguard 兜底
    params: {gpu33.cache_ram: [64, 96], gpu36.cache_ram: [56, 88]}
    evidence:
      - {src: docs/infra/utilization.md §2 改动, quote: "A、B 不是缓存大小"}
    confidence: high
    status: 确认
    date: 2026-10-31
