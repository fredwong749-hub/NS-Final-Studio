    then: set_active 拒绝坏图 / 已标不要 / 总调度驳回过的版本（BadImage），并记审计（actor 默认取调用方模块.函数）；退回旧版的逻辑只退到可用版本（pipeline.deactivate、takes_ui.reject）；清空当前用 clear_active。静态测试禁止新增直接写 active 的代码；tools/qa/active_audit.py 扫全部镜头：当前指向驳回版 = 违规，当前和审计日志对不上 = 有路径绕过入口（缺陷猎捕 DH-F19 / DH-F20）
    check: [tests/test_active_audit.py, tools/qa/active_audit.py, tools/qa/defect_hunt.py]
    evidence:
      - {src: data/audit/20261101.jsonl, note: "17:39:39 fred 在 ep01-S5 image v4 点“不要”（第 388 行）；takes_ui.reject 退回 clean[-1] = v3，v3 有 master_reject（07:41 总调度驳回），set_active 不查驳回、也不写审计"}
      - {src: data/producer/current_changes.jsonl, note: "ep01-S5 image：17:01 auto_current 清空 → 17:43 记录的 from 已经是 3，中间没有任何一行"}
