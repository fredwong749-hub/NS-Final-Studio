    domain: ops
    link: [P10-P11, P11-RETRY]
    title: 改“当前版本”只走 ns_render.pipeline 的 set_active / clear_active / deactivate；被驳回（总调度 master_reject、项目方 / 界面标不要）的版本不能当当前——驳回后立即撤下当前版本（总调度 11-01 r6 定，PROD 改 master_reject 流程；⤴ 取代旧的“驳回版留作当前直到替换版通过”）；每次变化都写 current_changes.jsonl
