    confidence: high
    status: 确认
    date: 2026-11-01
  # ---- AUDIT 草案收编（knowledge/inbox/confirmed/2026-11-01_audit_r1b_q22.yaml；总调度 11-01 晚指派 RSI 补检查）
  - id: K-OPS-Q22
    domain: ops
    link: [P11-RETRY]
    title: 新派的 loop 开工前，总调度先在 ownership.yaml 给它登记文件；要改别人的文件先写 CONSENT，不能边做边越界
    when: 总调度新派一个 loop（如 RESEARCH、VIDEO-RCA），或派单里写了要改别的 loop 的文件
    then: 派单的同时在 tools/qa/ownership.yaml 加这个 loop 的条目（工具目录、规则文件、数据目录）；跨 owner 的文件先在 docs/uimaster/LOCKS.md 写 CONSENT 行。iter_gate O1：--loop 在 ownership.yaml 里没有条目 → 直接不通过；改了别人的文件又没有 CONSENT → 越界不通过
    check: [tools/qa/iter_gate.py, tests/test_iter_gate.py]
    evidence:
      - {src: docs/audit/RESEARCH_r01.md, note: "RESEARCH 改了 ITERAUDIT 的 tools/qa/writer_lints.py，没有 CONSENT；tools/research/**、research_realism.yaml 都没有 owner"}
      - {src: tests/test_iter_gate.py, note: "test_c1_not_applicable_for_rule_loop_and_o1_needs_registration：未登记 loop → O1 fail"}
    confidence: high
    status: 确认
    date: 2026-11-01
