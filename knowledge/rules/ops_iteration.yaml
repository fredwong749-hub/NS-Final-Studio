    check: [tools/qa/defect_hunt.py, tests/test_defect_hunt.py]
    evidence:
      - {src: data/acting/gaze_labels.json, note: "首帧 100 张有效标签里 71 张看镜头；片头 72 条里 56 条看镜头（10 条还带定格）"}
      - {src: data/acting/calib_score.json, note: "检测器首帧召回 0.423 / 误报 0.207，片头召回 0.607，均不可分"}
      - {src: data/qa/defect_hunt/state.json, note: "同时 DH-S01 / DH-S02 = 0：剧本没写看镜头、80 镜首拍都有视线落点 → 看镜头是出图 / 出片模型默认行为，修法在渲染侧（K-REN-G01 / G02）"}
    confidence: high
    status: 确认
    date: 2026-11-01
  - id: K-OPS-Q15
    domain: ops
    link: [P11-RETRY]
    title: 规则里写的写作 lint 号必须在写作链路的校验器里真的会跑（validate_qwen_script.RULES 或编译器 lint），只在别处定义 = 写作模型永远看不到
