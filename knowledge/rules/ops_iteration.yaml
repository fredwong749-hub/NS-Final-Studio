# 迭代协议规则（ITERAUDIT 2026-11-01）。check 字段 = 强制这条规则的代码 / 闸门；iter_gate.py RL 项要求新规则都带 check。
rules:
  - id: K-OPS-Q01
    domain: ops
    link: [P11-RETRY, P10-P11]
    title: 每个迭代 loop 收轮前必须跑 iter_gate，退出码 0 才算本轮完成；未测 ≠ 通过
    when: 任何 agent 的 round / iteration（UI 点击扫描、排版、复测、资产重出、参考锁定、出片、模型对比、autopilot）宣布“本轮完成 / 已修 / 已验证”之前
    then: 按 docs/ITERATION_PROTOCOL.md 7 步走（项目方任务 → 先测正确性 → 改 → 他人复核 → 回归：G10 + data_parity + 契约 → 带证据入账 → 规则带 check）；运行 tools/qa/iter_gate.py --loop <名> --round <轮> --task OTn --changed … --verifier … --verify-evidence … --report …；FAIL 回滚或继续修，INCOMPLETE 补测；只改 tools/qa/ownership.yaml 里属于自己的文件，共享文件只走规定写入口
    check: tools/qa/iter_gate.py
    evidence:
      - {src: docs/ITERATION_PROTOCOL.md §0 审计结论, quote: "只量排版 / 间距，没量内容是否等于后端"}
      - {src: docs/uirsi/rounds/r19-r25.md, quote: "T4–T7 卡在生产状态闸门……不扣界面分"}
      - {src: knowledge/RSI_LEDGER.md UIA5, quote: "r1–r3 的 detect 一条都没抓到"}
      - {src: tools/iterate_loop/reviewer.py failures(), quote: "thr is None or v is None: continue"}
    confidence: high
    status: 确认
    date: 2026-11-01
  - id: K-OPS-Q02
    domain: ops
    link: [P11-RETRY]
    title: 新写进知识库的规则必须带 check 字段（强制它的闸门 / 测试 / 校验器路径），否则不算学会
    when: 任何 loop 把教训写进 knowledge/rules/*.yaml
    then: 同一轮里给出强制检查（测试、校验器、gate 脚本或 detect 流程），在条目里写 check：路径；没有检查的新教训只能进 knowledge/inbox 当草案；11-01 之前已有的无检查规则标 enforced=false 继续作为指引生效（清单 docs/master/unchecked_rules.md，owner 在 sweep 里补 check 后删标记）；iter_gate RL 项只对没标 enforced=false 的缺检查规则判不通过，并核对所有 check 路径存在
    check: tools/qa/iter_gate.py
    evidence:
      - {src: docs/ITERATION_PROTOCOL.md §0 审计结论, quote: "260 条规则里 155 条没有任何下游落点"}
      - {src: docs/GEN_CONTRACT.md §0, quote: "签字（写入 data/review_pages/<批次>/master_review.md）"}
    confidence: high
    status: 确认
    date: 2026-11-01
  - id: K-OPS-Q03
    domain: ops
    link: [P11-RETRY, P5-P6]
    title: 测试永远不写真实 data/：数据根默认指向临时目录，写真实数据即抛错，会话结束查遗留线程和哨兵文件
    when: 任何 pytest 运行（含 iter_gate T1）；写会起后台线程 / 定时器的代码或测试
    then: tests/conftest.py 会话开始装 tools/qa/real_data_guard.py（open / Path.write_* / os.replace 等写真实 data/ 一律抛 RealDataWriteError 并记账），P.DATA、P.RENDERS 等数据根指到临时目录；确需真实数据的用例标 @pytest.mark.real_data；测试起的后台线程必须在用例里 join（不能活过夹具，否则 monkeypatch 还原后会写到别处）；会话结束有违规、遗留非守护线程或真实 takes.json 等哨兵文件 mtime 变化 → 退出码 1；iter_gate T1 读 data/qa/test_guard_last.json，没有本次报告即判不通过
    check: [tests/test_real_data_guard.py, tools/qa/real_data_guard.py, tools/qa/iter_gate.py]
    evidence:
      - {src: tests/conftest.py, note: "11-01 03:15 tests/test_unified_frame.py 后台 postflight 线程在 monkeypatch 还原 P.RENDERS 后写坏真实 data/renders/ep01/S1/takes.json（REFLOCK 报，总调度转）；10-31 03:02 同形事故（_drain_jobs_before_unpatch 注释）"}
      - {src: tests/test_real_data_guard.py, note: 守卫跳闸自测（含后台线程吞异常的情形）}
    confidence: high
    status: 确认
    date: 2026-11-01
  - id: K-OPS-Q11
    domain: ops
    link: [P11-RETRY]
    title: 测试按独立模块名加载 tools/ 脚本；同名脚本（run.py 等）裸 import 有歧义时直接报错，不许拿错模块
    when: 测试或脚本要 import tools/ 下的脚本；tools/ 里出现同名文件（现有 run.py、report.py、build_jobs.py 各 2 个）
    then: pytest 用 --import-mode=importlib（pyproject addopts，tests 在 pythonpath 里保留测试间 import）；tests/conftest.py 装 tools/qa/script_name_guard.py：同名脚本的目录同时在 sys.path 上时 import 抛 AmbiguousScriptImport，只有一个时导入那一个并换掉缓存里的另一个；测试加载 tools 脚本用 importlib.util.spec_from_file_location("<唯一名>", 路径)；不改 owner 的脚本名
    check: [tests/test_script_name_guard.py, tools/qa/script_name_guard.py]
    evidence:
      - {src: tests/test_bakeoff.py, note: "REFLOCK 11-01 全量测试：tools/autopilot/run.py 与 tools/bakeoff/run.py 同名，按名字 import 撞车，2 个收集错误（no attribute 'BASE'）"}
      - {src: tests/test_script_name_guard.py}
    confidence: high
    status: 确认
    date: 2026-11-01
  - id: K-OPS-Q12
    domain: ops
    link: [P11-RETRY, P3-P4]
    title: 影响剧本 / 分镜写法的教训，规则必须同时进写作方知识包（writer_text）和 P4 校验（lint），写作模型返修环自己改
    when: 任何 loop 发现 bug、找到解决办法、写规则时，教训涉及剧本 / 分镜该怎么写（domain=writer 或 link 在 P0–P4）
    then: 规则带 targets writer_prompt + writer_text（compile.py → config/recipes/writer_knowledge.md）+ lint（P4 校验器里有定义的规则号；新机检加在 tools/qa/writer_lints.py，写作链路为 block）；iter_gate RL 对本轮新规则缺任一项判不通过
    check: [tools/qa/iter_gate.py, tests/test_iter_gate.py, tests/test_writer_lints.py]
    evidence:
      - {src: knowledge/rules/writer_iteration.yaml, note: "项目方 11-01 原话：记得每一次发现bugs,找到solution后,把规则写到系统code去,这样,剧本llm更好去自动改进"}
    confidence: high
    status: 确认
    date: 2026-11-01
  # ---- RSI 第 2 轮（fredw-2b 派，2026-11-01 下午；R11-11 续）
