    status: 确认
    date: 2026-11-02
  - id: K-OPS-S03
    domain: ops
    link: [P5-P6, P10-P11]
    title: 违约自动开工单到 data/sentinel/issues.jsonl（只追加；id / SLO / 证据 / 首次发现 / 负责 loop / 状态 / decider=code）；同一 key 只开一张；恢复后自动 resolved 并写恢复时间；没测到不算恢复
    when: 任何探针返回 violated=true，或此前开着的 key 这一拍测到正常
    then: 只经 tools/sentinel/store.py IssueStore.apply 写工单；data/sentinel/open.json 是看板 / 总调度 / 编排器读的未关闭快照；口径变了不再测的 key 用 sentinel.py retire（status=retired，写原因），不许手删
    check: tests/test_sentinel.py::test_store_dedup_and_resolve, tests/test_sentinel.py::test_store_missing_data_does_not_resolve, tests/test_sentinel.py::test_store_severity_and_owner_override
    evidence:
      - {src: tools/sentinel/store.py, note: "11-02 02:48 首拍 15 张工单（S13 等总调度 42/39 个对象、S6 配置不一致、S5 cut 失败、S4 跳板 216/小时），无重复开单"}
    confidence: high
    status: 确认
    date: 2026-11-02
  - id: K-OPS-S04
    domain: ops
    link: [P5-P6]
    title: 探针只读且不加服务器负载——远程每台每拍只走一次 rssh 常驻主连接的合并只读调用（tools/sentinel/remote_probe.py，timeout + nice -n 19 + 线程=1），不新建 ssh、不改生产文件、不重启服务
