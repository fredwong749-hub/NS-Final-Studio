# SENTINEL 11-02（总调度 fredw-2b 派；docs/master/SLO.md；ITERATION_PROTOCOL §G1）：问题由系统先发现，不靠项目方指出
# 项目方原话（11-02 02:3x）：“每次都是我指出来你才去修……这不是 RSI……你还没有具备 fully autopilot 的能力。”
# 编号说明：K-OPS-S01 已被 SYSARCH 用于 arch_scan 棘轮，SENTINEL 从 S02 起
rules:
  - id: K-OPS-S02
    domain: ops
    link: [P5-P6, P10-P11]
    title: 每条 SLO（docs/master/SLO.md S1–S13）必须有一个常驻探针（tools/sentinel/probes.py），阈值只从 config/policies/sentinel.yaml 读；新增 SLO 先加探针再算上线
    when: 新增或修改一条 SLO，或项目方 / 总调度先于系统发现一个问题（记“探针缺口”）
    then: 在 sentinel.yaml 加该 SLO 的阈值项（value / source / enforced_by / status / owner / owner_loop / every_s），probes.py 加 p_sN 并登记 PROBES / CFG_OF，judges.py 加纯函数判定；sentinel.py serve 每 60 s 一拍按 every_s 调度；回放补一条证明能比人早发现
    check: tests/test_sentinel.py::test_gpu_idle_needs_ready_and_span, tests/test_sentinel.py::test_score_p50_and_backlog, tests/test_sentinel.py::test_human_wait_and_gap
    evidence:
      - {src: docs/overnight/morning_20261102.md, note: "11-02 夜间 9 次问题全由项目方 / 总调度目检先发现（暂停 12 分钟、gpu36 两边不派、打分积压、:8870 旧服务、refs 缺失、vqa.json 被还原、gpu33 全 0%、底座断、看镜头漏检）"}
