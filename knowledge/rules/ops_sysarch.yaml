rules:
  - id: K-OPS-S01
    domain: ops
    link: [P5-P6]
    title: 结构退化只许减不许增——tools/qa/arch_scan.py 棘轮（没 timeout 的子进程、直接起 ssh、自写 def ssh、写死 series10_v1 / 服务器路径、读文件失败静默放行、非原子写 JSON、未入版代码被已入版代码 import、无主文件）
    when: 任何 loop 交 cut 之前；SYSARCH 每 30–60 分钟巡检
    then: 跑 python tools/qa/arch_scan.py --check（或 --files <本轮改动> --check）；任一文件某项计数比 data/sysarch/baseline.json 大、或新冒出未入版却被 import 的模块 = 不过，回负责方修；失败静默放行确属调用方显式处理的，在 except 行写 arch-ok 标记（井号 + arch-ok + 冒号 + 理由）豁免；基线只由 SYSARCH 在关单后收紧（--tighten）；新写的未入版 .py 一律零退化：iter_gate A2 对本 loop 名下全部未入版文件跑 arch_scan --new --owner <loop> --check（不限 --changed），不过不许交 cut（总调度 11-02 05:4x）
    check: tests/test_arch_scan.py::test_iter_gate_runs_a2_new_files, tests/test_arch_scan.py::test_new_files_owner_filter, tests/test_arch_scan.py::test_ratchet_only_flags_regressions, tests/test_arch_scan.py::test_no_timeout_counts_only_missing_timeout, tests/test_arch_scan.py::test_silent_read_fail_open
