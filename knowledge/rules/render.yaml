# 生成参数（H3 视频 / 关键帧）。targets kind=recipe 的值由 compile.py 对照 services/recipes/recipes/*.yaml 校验。
rules:
  - id: K-REN-001
    domain: render
    link: P7-P8
    title: H3 底模用 pruned int8（FL2VA / Ref2VA 各一）
    when: 所有 H3 视频
    then: FL2VA 用 minimax_h3_fl2va_pruned_int8_convrot；Ref2VA 用 minimax_h3_ref2va_pruned_int8_convrot；不用 w4a8 + LoRA
    targets:
      - {kind: recipe, id: _base, path: model.unet, value: minimax_h3_fl2va_pruned_int8_convrot.safetensors}
      - {kind: recipe, id: two_person_ref2va, path: model.unet, value: minimax_h3_ref2va_pruned_int8_convrot.safetensors}
    evidence:
      - {src: docs/ep02_iter/h3_comfy_expert.md §2 UNETLoader, quote: "pruned INT8 clean"}
    confidence: high
    status: 确认
    date: 2026-10-31
  - id: K-REN-002
    domain: render
    link: P7-P8
    title: 成片默认基模 24 步、euler / simple、shift 12/3、BasicGuider cfg 1
    when: 成片（非预览）视频
    then: 不挂 Turbo；24 步；euler + simple；shift 12/3（等于 ComfyUI 默认）；BasicGuider cfg 1，负面词无效
    targets:
      - {kind: recipe, id: _base, path: sampling.steps, value: 24}
      - {kind: recipe, id: _base, path: sampling.sampler, value: euler}
      - {kind: recipe, id: _base, path: sampling.scheduler, value: simple}
      - {kind: recipe, id: _base, path: sampling.shift, value: [12.0, 3.0]}
      - {kind: recipe, id: _base, path: sampling.guider, value: BasicGuider}
      - {kind: recipe, id: _base, path: sampling.cfg, value: 1.0}
      # 画布 video-jobs 默认基底不再归这条管：项目方 2026-11-01 原话“把 Flex 设成默认基底” → config video_bases.default = pika_flex
      # （fredw-92/PF，video_bases.default_change_pf）；本条只约束 recipe _base（H3 配方公共基底）
      # series10 重出默认 ⤴ 已由 i2va_pika_flex 取代（项目方 2026-11-01 ~16:20 原话“改用 Pika Flex (Recommended)”——“之后重出的镜头都走 Pika，已经通过的镜头不动”，见 K-REN-301 修订、recipe_choice.json）；_base 24 步仍是非 Pika 配方的基底与 flush 镜的回退
    evidence:
      - {src: docs/ep02_iter/LEARNED_SPECS.md §B 视频默认配方, quote: "official_base 24 步 + 只给首帧"}
      - {src: docs/ep02_iter/h3_comfy_expert.md §0 第 1 条, quote: "shift 12/3 就是 ComfyUI 对 H3 的默认值"}
    confidence: high
    status: 确认
    date: 2026-10-31
