# IMGGEN（2026-10-31，series10_v1 十集出图）：6 卡批量出设定图 / 首帧时学到的东西。
# 工具：tools/series10_imggen/imggen.py（调度 + 自动质检 + 换 seed 重出），tools/series10_imggen/score_remote.py（出图机器上打分）。
# 证据数字见 data/pipeline/runs/series10_v1/images/findings.json（由 imggen.py findings 生成）。
rules:
  - id: K-OPS-121
    enforced: false   # 还没有强制检查（ITERAUDIT 11-01 盘点；补 check 后删这行）
    domain: ops
    link: P5-P6
    title: 多道批量出图：每道一个提交线程 + 一个取图线程，道深度按服务器队列里本工具的任务数算
    when: 用 tools/series10_imggen/imggen.py（或任何多道批量出图工具）同时驱动 gpu33 / gpu36 的多个 ComfyUI
    then: 每道独立线程，一条隧道慢只影响自己那道；每 4 s 读 /queue，本工具在服务器上的任务数（运行中 + 排队）< 2 就补交；取图（/history + /view）放到独立线程，不排在提交前面；暂停单道用 control.json 的 hold_lanes
    params: {imggen.per_lane: 2, imggen.queue_poll_s: 4}
    evidence:
      - {src: data/pipeline/runs/series10_v1/images/imggen.log, quote: "22:06 只有 3/6 张卡在出图", note: 旧版 6 道串行在一个循环里，笔记本 Wi-Fi 约 270 KB/s，一张 PNG 走 /view 要 7–35 s，一道卡住其他道全部空转；22:27 改成每道独立线程后 6 道都在出图}
      - {src: tools/series10_imggen/imggen.py, note: lane_loop / fetch_loop}
    confidence: high
    status: 确认
    date: 2026-10-31
  - id: K-OPS-122
    enforced: false   # 还没有强制检查（ITERAUDIT 11-01 盘点；补 check 后删这行）
    domain: ops
    link: P5-P6
    title: 出图质检在出图那台机器上原地读 ComfyUI 输出目录打分，不经笔记本回传
    when: 对 gpu33 / gpu36 出的图做身份 / 景别 / 文字检测
    then: 用 /history 拿到 subfolder + filename，拼上该道的 --output-directory，在那台机器上用 /root/work/fredw/venv_idm 跑 score_remote.py（清单走 ssh stdin，几 KB）；两台都已装 insightface buffalo_l 与 rapidocr-onnxruntime（只装在自己的 venv）
    evidence:
      - {src: data/pipeline/runs/series10_v1/images/imggen.log, note: 旧做法下载到笔记本再 scp 上 gpu36：21 张 6.5 MB 传了 3 分钟以上还没完；原地打分一批 14 s（含载模型）}
      - {src: tools/series10_imggen/score_remote.py}
    confidence: high
    status: 确认
    date: 2026-10-31
  - id: K-REV-121
    enforced: false   # 还没有强制检查（ITERAUDIT 11-01 盘点；补 check 后删这行）
    domain: review
    link: P5-P6
    title: 身份“不像他人”门槛随参考彼此的相似度抬高：max(0.40, 两人参考互相余弦 + 0.05)
    when: 用 ArcFace（identity_metric 同模型）判定设定图 / 首帧里的角色身份
    then: 本人 ≥0.50；对每个他人，余弦 < max(0.40, cos(本人参考, 他人参考) + 0.05)。顾沉与陈宇的脸部参考互相就有 0.429，固定 0.40 会让顾沉的每一张都判“像陈宇”
    params: {identity.same: 0.5, identity.other_floor: 0.4, identity.other_margin: 0.05}
    evidence:
      - {src: data/assets/identity_refs/manifest.json, note: gu_chen vs chen_yu_sheet 0.369；脸部裁切之间实测 0.429}
      - {src: data/pipeline/runs/series10_v1/images/findings.json, note: 顾沉 3 个造型暂定与陈宇 0.415–0.423，本人 0.92，按新门槛通过}
    confidence: high
    status: 确认
    date: 2026-10-31
  - id: K-REN-122
    check: [tests/test_rsi_rule_checks.py]   # RSI 11-01 补引用（docs/rsi/UNCHECKED_AUDIT.md）
    domain: render
    link: P4-P6
    title: 768×1344 竖构图首帧的景别自动判定：主角色脸框高 / 画面高 → 档位，允许差一档
    when: 首帧自动质检判断景别是否符合 Shot Spec（K-REN-101 的景别）
    then: 脸高 ≥0.45 大特写；0.27–0.45 特写；0.17–0.27 近景 / 中近景（同为“胸部以上”）；0.115–0.17 中景；0.095–0.115 中全景；0.05–0.095 全景；<0.05 远景。与要求差 ≥2 档判不合格；局部特写（首句写手 / 脚 / 鞋等且无脸）不判景别和身份
    params: {framing.bands: [0.45, 0.27, 0.17, 0.115, 0.095, 0.05], framing.tolerance: 1}
    evidence:
      - {src: data/pipeline/runs/series10_v1/images/findings.json, note: 首批 48 张人工对照：全身站姿脸高 0.088（ep03-S5），膝上 0.14，胸部以上 0.17–0.27，特写 0.27–0.35；旧档位把全身判成中景}
    confidence: medium
    status: 建议
    date: 2026-10-31
  - id: K-REN-123
    enforced: false   # 还没有强制检查（ITERAUDIT 11-01 盘点；补 check 后删这行）
    domain: render
    link: P4-P6
    title: Qwen-Image 2.1 首帧：要“特写”时常出成中景 / 中全景，换 seed 只救回一部分，根治要在提示词侧
    when: 编译器出的首帧提示词（首句“特写构图。”）+ lin_wan_qi_v1 0.8，768×1344
    then: 质检按 K-REN-122 判，不合格自动换 seed（≤3 次）；仍不合格的镜交 PROMPT 在编译器里加强特写描述（例如“脸占画面大半、头顶到下巴入画、背景只剩虚化”），出图端不改提示词（K-REN-103）
    writer_text: 特写镜的首帧画面描述只写脸和手边一件小物，不要同时写全身动作、鞋或整个房间——写了全身动作的特写镜，出图会退成中景。
    evidence:
      - {src: data/pipeline/runs/series10_v1/images/findings.json, note: 80 镜首次景别不合格 14 镜，换 seed 救回 6；最终 8 镜仍不合格，其中 6 镜是“要特写得中景 / 中全景”（ep02-S1、ep03-S1、ep06-S1、ep07-S3、ep08-S1、ep09-S1）}
    confidence: medium
    status: 建议
    date: 2026-10-31
