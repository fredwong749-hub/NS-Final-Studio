# 研究文档 docs/research/imglab/（00–05，每条带引用）；追踪表 docs/research/imglab/TRACK.md；对比页 data/review_pages/imglab/index.html。
# Claude 不写不评剧本内容：只改编译层结构，剧本原文一字不动。
rules:
  - id: K-REN-901
    domain: render
    link: [P6-P7]
    title: 按景别删句时保住主语——被删分句以人名开头，名字补到下一个保留分句前；视线句不删；回归 0 孤儿
    when: ns_agent.framing.strip_fullbody（脸部特写删站姿 / 全身句，K-REN-123）、framing.filter_parts（按景别删看不见的部件，K-REN-101 / 707），compiler.compile_shot 对正文调用时传 subjects=在画角色
    then: 被删分句以在画角色名开头 → 名字作为单独一句插到下一个保留分句前（下一句本身以人名开头或是通用质感句时不插）；名字在宾语位置（“站在林晚侧后方”）不当主语；含“视线 / 目光 + 落在 / 看向…”的视线句不因部件词被删。没有删到带主语分句的镜头提示词逐字不变。开关 config/recipes/image_framing.json keep_subject（false = 旧行为）
    check: [tests/test_imglab_subject_binding.py, tools/imglab/orphan_check.py]
    evidence:
      - {src: data/renders/ep06/S2/takes.json 第 6 版, note: "剧本“林晚跪坐…雾霾天蓝色及腰直发…；顾沉站在画面右侧，白衬衫…”；strip_fullbody 删掉“林晚跪坐…”“顾沉站在…”两句（主语跟着丢），无主语描写紧跟【顾沉】锁 → 顾沉长出蓝色长直发和水晶甲；Q2 外层探针顾沉短发概率 0.0049"}
      - {src: docs/research/imglab/05_ep06S2_bleeding_rca.md, note: "102 镜旧编译：小句归属与剧本不一致 23 镜 236 句（orphan_check misowned）；新编译 0；提示词改动 29 镜，其余 73 镜逐字不变（docs/research/imglab/data/prompt_diff_F1F3.json）"}
    confidence: high
    status: 确认
    date: 2026-11-02

  - id: K-REN-902
    domain: render
    link: [P4-P7]
    title: 脸部特写 + ≥2 人露脸 = 构图自相矛盾；编译改双人近景首句，preflight I6 拦“脸占六成 + 两张脸都入画”，写作 lint 阻断
    when: compiler.compile_shot（framing.two_face_close_conflict）；gen_contract.preflight I6（framing.framing_clash）；写作 lint（HOLLYWOOD 接 framing.two_face_close_conflict）
    then: 特写类 + 脸部主体 + 露脸人数 ≥2 → 首句用 TWO_FACE_CLOSE_LEAD（双人近景：两张脸各约三成，Q3 档差 1 在容差内）；提示词同时含“脸部占画面约六成”与“两张脸都清晰入画”→ I6 fail；写作侧：特写只放一个露脸人物，双人露脸至少写近景（或焦点人物特写 + 对方局部 / 背影）。开关 image_framing.json two_face_close（off = 旧行为）
    check: [tests/test_imglab_subject_binding.py, tools/imglab/orphan_check.py]
    evidence:
      - {src: data/renders/ep06/S2/takes.json 第 6 版, note: "要特写（档 1），出双人中景，脸高 0.185（档 2）；同类 ep04-S1、ep06-S1/S9、ep07-S1 共 5 镜"}
    confidence: high
    status: 确认   # 编译 / preflight 确认；A/B 出图效果见 IMGLAB r1
    date: 2026-11-02

  - id: K-REN-903
    domain: render
    link: [P6-P7]
    title: 在画的人全是局部（不露脸）→ 按局部特写编译：局部首句 + 画面上沿在下颌以下，去脸部通用句与“不露脸”否定句，局部锁只留可见部位（成年女性 / 成年男性），视线句只给露脸的人补
    when: compiler.compile_shot（framing.partial_only → subject=part、framing.narrow_lock、closeup_lead partial=True）；frame_job.eyeline_note
    then: cast 全部是局部（faced_people 为空）时不按剧本景别词出人像首句；锁里年龄数字 / 国籍 / 发色句去掉（部位含“发 / 头”才留发色），HC-07 成年句保留为“成年女性 / 成年男性”；视线句跳过局部的人（混合镜里局部人物原先被补的“X 的视线落在 Y 的脸上”一并去掉）。开关 image_framing.json partial_only（false = 旧行为）
    check: [tests/test_imglab_subject_binding.py, tools/imglab/orphan_check.py]
    evidence:
      - {src: docs/research/imglab/06_partial_noface_design.md, note: "ep05-S3/S6/S7 现行提示词含“近景构图（胸部以上）”“林晚的视线落在阿岚的脸上 / 阿岚的视线落在林晚的脸上”“面部清晰对焦，五官锐利”“【林晚】22岁中国成年女性，蓝发及腰”→ 模型画整张正脸，Q1 全拦、重出到第 82 版"}
      - {src: docs/research/imglab/data/prompt_diff_K903.json, note: "102 镜：全员局部 6 镜脸部词 → 0；另 16 镜混合镜只去掉局部人物的视线补句，其余 80 镜逐字不变"}
    confidence: high
    status: 确认
    date: 2026-11-02

