# PROMPTFIX（总调度 fredw-2b 派，2026-11-02 16:5x；ALIGNMENT 第 2–6 步）：出图一致性编排的编译层修复。
# 来源：fb-0004（ep04-S10 多人）、fb-0005（ep05-S3 站位）、fb-0006（ep07-S12 多手）、fb-0007（ep08-S5 男主穿女装）、ep07-S3 尾帧陌生女人。
# 全部用结构化手段（参考槽、送脸、站位契约 + 出图后位置核对、种子流），不靠负面词（Turbo cfg=1，workflows.negative_for 丢负面词）。
# 开关：config/recipes/image_framing.json promptfix.*（缺省全开；false = 旧行为）。Claude 不写不评剧本内容：剧本原文一字不动。
rules:
  - id: K-REN-950
    domain: render
    link: [P6-P7]
    title: cast 写“局部”（不露脸）但构图可能露脸 → 编译报 cast_face_conflict，并按送脸处理（身份脸 face_of）
    when: ns_agent.asset_refs.resolve_shot：cast 局部、正文没写到脸、不是背影，景别是近景 / 中近景 / 中景 / 全景 / 远景且主体是人（不是局部 / 物件特写）
    then: 视为可能露脸：送该人身份脸（asset_refs.face_of，L-122），warnings 记 cast_face_conflict（rule K-REN-950），compile_trace.conflicts 带出；写作侧 lint QW-W13 报矛盾。“不露脸”只能靠局部特写裁切 / 背影来保证，不能只靠不送脸
    check: [tests/test_promptfix.py]
    evidence:
      - {src: data/renders/ep05/S3/takes.json, note: "92 版；v81–v85 Q1 全部“本镜 cast 写不露脸，但画面里出了脸且不像本人”（脸高 0.24–0.26，最像 lin_wan 0.32–0.40）；cast 林晚（局部｜肩头｜中）、阿岚（局部｜手｜右），景别近景"}
      - {src: data/review_pages/promptfix/scan.json, note: "全剧标了局部 / 背影的镜里 154 版出了脸（Q1 判定），ep05 136、ep07 18；新编译检出矛盾 15 镜"}
    confidence: high
    status: 确认
    date: 2026-11-02

  - id: K-REN-951
    domain: render
    link: [P6-P7]
    title: 局部且不露脸的人只送 cast 部位看得到的单品，不送设定图 / 整套参考板，正文不补“要穿全”
    when: resolve_shot / frame_job.outer_items：cast 局部、不露脸、不是背影的人（两人以上同框时尤其）
    then: 参考槽只放该人 cast 部位（肩 → 颈部饰品；手 → 手部单品；腰 → 腰部饰品）对应区的鞋 / 饰品 / 指甲，服装件和设定图一律不送；“X本镜造型Y要穿全”不补；compile_trace.wardrobe_scope 记收窄范围。参考板每块只放同一个人（plan_slots mergeable 原有约束）
    check: [tests/test_promptfix.py]
    evidence:
      - {src: data/renders/ep08/S5/takes.json image_013_31f1dfc6, note: "林晚（局部｜肩后）被送了整块参考板（造型 B 设定图 + 黑色漆皮长风衣 + 内衣 + 指甲）并补“林晚本镜造型B要穿全：黑色漆皮长风衣…”；本地看图（gpu36 Qwen3-VL）：“那件黑色亮面漆皮长风衣穿在画面中部的男性身上”；takes 里 vlm_text 也记“顾沉 衣 黑色漆皮长风衣”，judge 仍判 pass"}
      - {src: data/review_pages/promptfix/scan.json, note: "全剧 8 镜生效（ep02 1、ep06 1、ep07 1、ep08 3、ep10 2）"}
    confidence: high
    status: 确认
    date: 2026-11-02

  - id: K-REN-952
    domain: render
    link: [P4-P7]
    title: 站位结构化——cast 的 x / depth 是唯一来源，编成 blocking 契约（作业 + compile_trace）+ 固定站位句 + 出图后位置核对
    when: frame_job.build_first（≥2 人在画或局部、x 不同）；tools/vqa/anomaly.judge（blocking_defects）
    then: job.blocking = cast 每人 {x, depth, presence, part}；正文没写每个人的画面左右时补 BLOCKING_NOTE（“站位：A在画面左侧…（按此左右站位，不互换）”，句式进 TEXT_NOTE_RES）；出图后按 ArcFace 认出的脸中心横坐标核对 x（左 <0.45W、右 >0.55W、中 0.25–0.75W），不符 → blocking_mismatch。区域提示 / ControlNet 姿态在现行 Turbo 多参考工作流上已证不可用（docs/research/imglab/TRACK.md T10 / T11），所以结构化落在“契约 + 核对 + 不过即重出”
    check: [tests/test_promptfix.py]
    evidence:
      - {src: data/renders/ep05/S3/takes.json image_011_8cdf619e, note: "cast 林晚 x=中、阿岚 x=右，提示词里一个左右词都没有；本地看图：蓝发女子在画面左侧"}
      - {src: data/review_pages/promptfix/scan.json, note: "两人以上同框 59 镜，其中 48 镜旧编译站位没进提示词（新编译补站位句）"}
    confidence: medium   # 站位句效果待 A/B；核对与契约确定性
    status: 确认
    date: 2026-11-02

