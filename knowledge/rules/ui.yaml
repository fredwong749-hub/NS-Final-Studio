    enforced: false   # 还没有强制检查（ITERAUDIT 11-01 盘点；补 check 后删这行）
    domain: ui
    link: P0-P1
    title: “新建剧本”入口常驻顶栏，不能只藏在菜单里
    when: 任何页面（画布、资产、成片、项目页）
    then: 顶栏左侧常驻“＋ 新建剧本”链接按钮（快捷键 N），去 #/script-create；工具菜单剧本组第一项也是它；项目页主按钮“＋ 新建剧本（从提纲）”
    evidence:
      - {src: docs/uirsi/STATE.md §2, quote: "入口没被删，是被两次改动藏起来了"}
      - {src: docs/ux_round5/IMPL_LOG.md §2, quote: "①“N 镜待补”去了写新剧本"}
    confidence: high
    status: 确认
    date: 2026-10-31
