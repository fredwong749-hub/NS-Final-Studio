# 界面 / 交互规则（UIRSI，P0→P12 各节点在 apps/web 上的做法）。每轮 RSI 把被证实有效的做法写回这里（docs/uirsi/rounds/rN.md）。
# 只讲界面怎么呈现、怎么确认；不写剧情、不评价内容；不进写作 / 审片提示词（没有 writer_text / director_text）。
rules:
