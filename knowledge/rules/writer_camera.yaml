      - {src: docs/ep02_iter/camera_language.md §2, note: "https://www.studiobinder.com/blog/what-is-the-180-degree-rule/", quote: "sets an imaginary axis, or eye line, between two characters"}
      - {src: docs/ep02_iter/camera_language.md §2, note: "https://en.wikipedia.org/wiki/Shot_reverse_shot", quote: "It is an example of an eyeline match."}
