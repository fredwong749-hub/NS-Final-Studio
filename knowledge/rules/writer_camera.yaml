    when: 两人对话的相邻镜
    then: 说话人朝向对方、视线落在对方；相邻正反打两镜里两人左右位置不变（180° 轴线，人物行 左/右 逐镜一致）
    targets: [{kind: writer_prompt, section: 镜头字段}]
