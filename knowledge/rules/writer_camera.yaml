    domain: writer
    link: P3-P4
    title: 每镜写景别 + 机位 + 运镜三项，景别用词表，运镜用官方动词
    when: 每镜 img / **镜头运动** / H3
    then: img 第②项景别 + 机位（低机位 / 过肩 / 主观 / 侧面 / 车窗外）；**镜头运动** 写官方运镜词｜幅度｜速度；H3 第二句起写运镜句
    targets: [{kind: writer_prompt, section: 镜头字段}]
    writer_text: 每镜都写清 景别（词表）+ 机位（低机位 / 平视 / 俯拍 / 过肩 / 主观视角 / 侧面）+ 一个运镜；**镜头运动** 行写 官方运镜词｜幅度=小/中/大｜速度=慢/正常/快，与 H3 运镜句一致。
