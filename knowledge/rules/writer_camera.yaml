    writer_text: 同场相邻镜用动作匹配（下一镜从上一镜动作中段进）或视线匹配（上一镜看向哪，下一镜就是哪）；换场用声音先行 0.3–0.5 秒；时间过渡才用叠化 0.3–0.5 秒。
