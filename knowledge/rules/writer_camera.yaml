# 镜头语言（PROMPT 2026-10-31，项目方原话：“提示词里面关于镜头描写（特写、拉长、转换、切场）这些东西学会了没有？”）
# 只讲格式与可实现性：系统怎么把镜头设计写成 H3 能执行的字段；不规定哪一镜该用什么镜头（那是写作方 / 导演的内容）。
# 详解与证据全文：docs/ep02_iter/camera_language.md。domain 分三块：writer（P3-P4 镜头设计字段）、prompt（P4-P7 运镜写法）、edit（P4-P10 转场）。
rules:
  - id: K-WRT-101
    domain: writer
    link: P3-P4
    title: 一镜 = 一次 H3 生成 = 一个连续镜头；景别变化用运镜，不在一段提示词里切镜
    when: 写分镜（P4）
    then: 每镜只有一个 [Shot 1]；需要换景别 / 换机位就拆成下一镜，镜内景别变化写成推 / 拉 / 摇 / 跟的连续运镜
    targets: [{kind: writer_prompt, section: 镜头字段}]
    writer_text: 一镜只拍一个连续镜头（H3 里只有一个 [Shot 1]）；镜内要从特写到近景，写成推 / 拉 / 摇的连续运镜；要换机位或换景别跳档，就拆成下一镜。
    evidence:
      - {src: data/ab/owner_workflows/minimax_h3_official_skills/h3-prompt-writing/references/base-en.txt §4.2, quote: "If only the distance or a slight angle needs to change, prefer camera motion"}
      - {src: data/ab/owner_workflows/community/binwu1__drama-series-agent/skills/drama-series-h3-r2v-prompts/references/ref2va-en-official.md, quote: "Prefer a single [Shot 1]"}
      - {src: docs/ep02_iter/competitor_flows.md 第368行, note: 一段提示词内多镜切换对身份的影响未验证}
    confidence: high
    status: 确认
    date: 2026-10-31
  - id: K-WRT-102
    domain: writer
    link: P3-P4
    title: 镜内多镜切换（[Shot N] At MM:SS.mmm, the camera cuts to…）只作实验，不进生产
    when: 想在一次生成里完成正反打或多景别
    then: 官方格式允许；我们镜头独立生成 + 剪辑，镜内多镜对身份 / 嘴型的影响未测，待 A/B
    targets: [{kind: writer_prompt, section: 镜头字段}]
    writer_text: 不在一镜的 H3 里写 [Shot 2] / cuts to；正反打、切景别都拆成相邻两镜（剪辑时切）。
    evidence:
      - {src: data/ab/owner_workflows/minimax_h3_official_skills/h3-prompt-writing/references/base-en.txt §4.2, quote: "[Shot 2] At 00:03.500, the camera cuts to..."}
      - {src: data/ab/owner_workflows/civitai/2734359__Better_Human_Motion_Minimax_H3, quote: "[Shot 4] At 00:06.000, the camera cuts to"}
    confidence: medium
    status: 待验
    date: 2026-10-31
