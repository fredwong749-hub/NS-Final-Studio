    when: hollywood.py 每轮生成后
    then: 评审 system = config/prompts/hollywood_judge.md（量表原文）+ Pika 参考；第 2、3 轮只发不及格维度和涉及镜号，系统只替换被改的镜（≥4 分项原样保留）；⤴ r3（项目方 11-01 22:1x“rsi HOLLYWOOD 达到95分,继续迭代”取代“最多 3 轮”）：返修发 <5 分项（评审对每个 <5 项写镜号 + 改到 5 分的原因），允许拆 / 合镜；到 95 或连续两轮有分数的轮无提升即停（作废轮不计，连续 3 轮作废停）；选中 = 通过不变量的轮次里总分最高者；未达 95 不导入
    params: {pass_score: 4, max_rounds: 8, target_sum: 47.5, fix_below: 5, judges_per_round: 2}
    evidence:
      - {src: config/prompts/hollywood_judge.md, note: 项目方 11-01 模板第三步原文}
    confidence: high
    status: 待验
    date: 2026-11-01
