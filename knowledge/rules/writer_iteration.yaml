  - id: K-WRT-A03
    domain: writer
    link: P3-P4
    title: 节奏：第一拍就在动；每拍 ≤2.5 秒；不连着两拍静止
    when: 镜头的分拍行
    then: 第一拍（0 秒起）的动作已经在进行（首帧是动作发生前一刹那，视频从第 0 帧起就动）；每拍 1.5–2.5 秒、一拍一个主动作；不连着两拍写保持 / 定住 / 一动不动（项目方 R11-2“剧情镜头还是很慢”、R11-8“停顿 1 秒多”）
