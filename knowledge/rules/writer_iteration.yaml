# 写作方规则回写（ITERAUDIT 2026-11-01）。项目方原话：“记得每一次发现bugs,找到solution后,把规则写到系统code去,这样,剧本llm更好去自动改进”。
# 今晚在出图 / 出片里发现、系统层已修的问题，凡是“剧本 / 分镜本来就该这样写”的，在这里同时给：
#   writer_text（compile.py → config/recipes/writer_knowledge.md，写作模型 system_parts 里）+ lint（P4 校验规则号，写作链路里是 block，进返修环）。
# 只讲格式与可实现性，不涉及剧情。
rules:
  - id: K-WRT-Q01
    domain: writer
    link: P3-P4
    title: 在画角色本镜造型里的外层衣物（西装外套 / 风衣 / 开衫…）写进 img
    when: 镜头 img 行；在画角色的本镜造型（造型行 服装=）含外层衣物，景别不是大特写
    then: img 写出外层衣物品名（穿着 / 敞开 / 脱下搭在手臂上都写明）；不写 = 出图丢外层（ep01 S1–S5 首帧没有西装外套，系统事后补丁）
    targets: [{kind: writer_prompt, section: 镜头字段}]
    writer_text: 在画角色的造型里有外层衣物（西装外套、风衣、大衣、开衫、披肩等）时，img 里写出这件外层的品名和状态（穿着 / 敞开 / 脱下搭在手臂上）；外层不写进 img，出图会把它丢掉。
    lint: [QW-W1]
    check: [tools/qa/writer_lints.py, tests/test_writer_lints.py]
    evidence:
      - {src: knowledge/RSI_LEDGER.md V14, quote: "S1–S5 的 img 行没写外套 → 首帧丢单品"}
      - {src: data/pipeline/runs/series10_v1/ep01/P4_ep01.md, note: 造型 A 含短款西装外套}
    confidence: high
    status: 确认
    date: 2026-11-01
  - id: K-WRT-Q02
    domain: writer
    link: P3-P4
    title: 人物行写“局部”的角色，img 不写他的脸 / 五官 / 头发
    when: 镜头 **人物** 行有角色标“局部”（只入画手 / 背 / 肩等部位）
    then: img 只写入画的部位；要写脸或头发，就把人物行改成“在画”（系统据此挂身份脸参考、按身份阈值质检）
    targets: [{kind: writer_prompt, section: 镜头字段}]
    writer_text: 人物行标“局部”的角色，img 只写入画的部位（手、背、肩），不写他的脸、五官、头发；脸或头发要入画，就在人物行写“在画”。
    lint: [QW-CH6]
    check: [tools/validate_qwen_script.py, tests/test_partial_face_described.py]
    evidence:
      - {src: knowledge/rules/gen_contract.yaml K-AST-236, note: "总调度 11-01 决定 1（ep03-S6）：cast=局部但 img 写到脸 / 头发"}
      - {src: tests/test_partial_face_described.py}
    confidence: high
    status: 确认
    date: 2026-11-01
  - id: K-WRT-Q03
    domain: writer
    link: P3-P4
    title: 分拍里至少写一个看得见的身体动作，不能每拍都是“保持 / 定住”
    when: 时长 ≥3 秒的镜头的 **分拍**
    then: 至少一拍写看得见的身体动作（抬手、转头、视线移向某物、呼吸起伏、起身）；全是保持 / 定住 / 静止的镜头出片会静止（ep01-S2 四个 seed 动作量 0.34–0.44 < 0.5）
    targets: [{kind: writer_prompt, section: 分拍与动作}]
    writer_text: 每镜分拍里至少有一拍写看得见的身体动作（抬手、转头、视线移向某物、胸口起伏、起身）；“保持 / 定住 / 静止 / 凝固”不算动作，整镜都这样写会出成静止画面。
    lint: [QW-W2]
    check: [tools/qa/writer_lints.py, tests/test_writer_lints.py]
    evidence:
      - {src: docs/series10_video/ep01_review.md, note: "ep01-S2 固定机位微表演 4 个 seed mean 0.34–0.44（门槛 0.5）"}
      - {src: knowledge/rules/render_video_s10.yaml K-REN-302, note: 系统层最低动作提示是兜底，写作方先写出动作}
    confidence: medium
    status: 确认
    date: 2026-11-01
  - id: K-WRT-Q04
    domain: writer
    link: P3-P4
    title: 只有 🎙（没有台词）的镜，在画说话人嘴是闭着的
    when: 镜头有 🎙 独白、没有对白，独白说话人在画
    then: 分拍 / motion 不写开口、张嘴、说话、嘴唇动；**嘴型** 写 <角色>=闭合；H3 里 </d> 后紧跟 lips remain completely closed
    targets: [{kind: writer_prompt, section: 声音}]
    writer_text: 只有 🎙 独白、没有台词的镜头，说话人在画时嘴是闭着的：分拍和 motion 不写开口、张嘴、说话、嘴唇动，**嘴型** 写 <角色名>=闭合。
    lint: [QW-W3, H3-D5]
    check: [tools/qa/writer_lints.py, tests/test_writer_lints.py]
    evidence:
      - {src: knowledge/rules/prompt.yaml, note: "画外音官方写法 + lips completely closed 紧跟 </d>"}
      - {src: knowledge/rules/render_video_s10.yaml, note: V7 口型检测只测画内对白；独白镜嘴动只能靠写法避免}
    confidence: medium
    status: 确认
    date: 2026-11-01
  - id: K-WRT-Q05
    domain: writer
    link: P3-P4
    title: 下装写明具体品类和长度，不用“西装裙 / 套裙 / 职业裙”
    when: 造型行 服装= 与镜头 img 写下装
    then: 写铅笔裙 / 包臀裙 / A字裙 / 百褶裙 / 直筒西裤 / 阔腿裤等具体品类（加长度：及膝 / 过膝 / 短款）；“西装裙”会被出图模型画成西裤（ep01 设定图是深灰铅笔裙，首帧出成黑长裤）
    targets: [{kind: writer_prompt, section: 镜头字段}]
    writer_text: 下装写具体品类和长度（铅笔裙、包臀裙、A字裙、百褶裙、直筒西裤、阔腿裤；及膝 / 过膝 / 短款），不写“西装裙 / 套裙 / 职业裙”这类泛称——出图会把“西装裙”画成西裤。
    lint: [QW-W4]
    check: [tools/qa/writer_lints.py, tests/test_writer_lints.py]
    evidence:
      - {src: knowledge/RSI_LEDGER.md V14, quote: "设定图是灰短外套 + 深灰铅笔裙"}
      - {src: data/pipeline/runs/series10_v1/ep01/P4_ep01.md, note: 造型 A 服装写“深灰西装裙”}
    confidence: high
    status: 确认
    date: 2026-11-01
  - id: K-WRT-Q06
    domain: writer
    link: P3-P4
    title: 接力镜“承：动作｜<动作>”要在本镜 img 或第一拍接上同一个动作 / 物件
    when: 衔接行写“接力｜承：动作｜…”
    then: 本镜 img 或分拍第一拍写出被承接的那个动作 / 物件（同一只手、同一件物件、同一个姿势），否则相邻两镜动作断开
    targets: [{kind: writer_prompt, section: 分拍与动作}]
    writer_text: 衔接写“接力｜承：动作｜<动作>”时，本镜 img 或分拍第一拍要写出被承接的同一个动作或物件（例如上一镜“指尖停在耳侧”，本镜第一拍从指尖在耳侧开始）。
    lint: [QW-W5]
    check: [tools/qa/writer_lints.py, tests/test_writer_lints.py, tools/qa/defect_hunt.py]
    evidence:
      - {src: docs/rsi/DEFECT_HUNT.md, note: "DH-S17 首轮 9 镜：ep01-S5、ep02-S3、ep02-S8、ep03-S3、ep03-S5 等承接动作在下一镜没写"}
    confidence: medium
    status: 建议
    date: 2026-11-01
  # ---- ACTING 11-01（项目方 R11-2 / R11-3 / R11-6 / R11-8 / R11-9；出处与原文 docs/acting/PERFORMANCE_RULES.md）
  - id: K-WRT-A01
    domain: writer
    link: P3-P4
    title: 每一拍写视线落点（看谁 / 看什么），不空着、不写“前方 / 远处”
    when: 有在画角色的镜头的分拍行
    then: 每拍 视线= 写画内的人（名字或部位）、物件，或画外有名有姓的声源；视线变化写成动作（从 A 移到 B）。没有落点，出图 / 出片默认对着镜头（项目方 R11-2、R11-8）
    targets: [{kind: writer_prompt, section: 分拍与动作}, {kind: director_prompt, section: 判定标准}]
    writer_text: 每一拍的 视线= 都写具体落点——画内的人（名字或部位，如“顾沉的手”）、物件（“汤碗边缘”），或画外有名有姓的声源；视线变化写成动作（“视线从手机移到他脸上”）。不写“看着前方 / 远处 / 虚空”，也不只写方向（“对面 / 画外 / 一旁 / 上方”要写成“对面的陈宇 / 画外门口的顾沉”）；跨镜视线方向保持一致，翻转要写明。
    director_text: 演员视线没有落点（空看、对着镜头）→ fail，action=reseed，issues 写“视线无落点 / 看镜头（R11-2）”。
    lint: [QW-A1]
    check: [tools/qa/acting_lints.py, tests/test_acting_lints.py]
    evidence:
      - {src: docs/acting/PERFORMANCE_RULES.md, url: "https://github.com/Ironieser/CineCrew/blob/main/src/agents/technical_director/technical_director.yaml", quote: "t2i_template MUST describe: - Who looks at whom (eyelines)"}
      - {src: docs/acting/PERFORMANCE_RULES.md, url: "https://github.com/MiniMax-AI/MiniMax-H3/blob/main/skills/h3-prompt-writing/references/base-en.txt", quote: "she lifts her gaze from the folded letter toward the passing city lights"}
      - {src: data/acting/calib_results.json, note: "现有 72 张首帧中 36 张检测器暂定判疑似看镜头（未标定）"}
    confidence: high
    status: 确认
    date: 2026-11-01
