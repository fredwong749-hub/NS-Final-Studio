    status: 确认
    date: 2026-10-31
  - id: K-WRT-209
    domain: writer
    link: P3-P4
    title: 写作模型返修用完后，系统自有片段 / 枚举槽位由系统自动补全（不需要人点头）
    when: P3-P4 写作模型返修轮次用完仍有 block
    then: run_chain.run_link 自动调用 p4_fragments.auto_fix：H3-X1 预拼锚点片段缺失 → 逐字补进第一句（紧跟登记外貌短语插入 “in <造型 EN>”，缺外貌短语则补 “, with <外貌短语> in <造型 EN>”）；锚点句写了同一角色的另一套登记造型 → 若本镜 img 写明“镜n起换装”而造型切换行镜号是镜号顺延前的旧号，就改切换行镜号，否则把造型 EN 换成本镜造型；QW-M1 配乐避让枚举 → 按本镜有无台词 / 🎙 改写（只改被点名的镜）。只在 block 变少时采用；台词、画面描述不动；改动写进报告 system_fix 和稿件头注释
    targets: [{kind: writer_prompt, section: 身份锚点}]
    writer_text: 锚点句里每个在画角色写一次“<外貌短语> in <本镜造型 EN>”，造型 EN 与本镜生效的造型行一致；合并 / 拆镜后镜号顺延时，造型切换行“镜N起”的镜号一起改。
    evidence:
      - {src: data/pipeline/runs/series10_v1/ep09/P4_ep09.md.report.json, note: "合并镜3+4 后造型切换行仍写旧号“镜5起”，锚点句按 img 写了造型 C → H3-X1；auto_fix 把切换行改为“镜4起”（改 1 行），0 block"}
      - {src: data/pipeline/runs/series10_v1/ep05/P4_ep05.md.report.json, note: "配乐避让枚举由系统修正"}
      - {src: tests/test_p4_fragments.py}
    confidence: high
    status: 确认
    date: 2026-10-31
