      - {src: data/pipeline/runs/series10_v1/P1_hairfix.report.json, note: "第 0 轮 HC-07 拦下 owner_line 里的“改发色”（来自 P0 Brief），先改 Brief 再改 storyline 后通过"}
      - {src: tests/test_hard_constraints.py}
    confidence: high
    status: 确认
    date: 2026-10-31
  - id: K-WRT-208
    domain: writer
    link: P3-P4
    title: 返修指引必须确定性点名（镜号 + 原文 + 目标位置 + 枚举值）；点名后 1 轮仍不过就不再找写作模型
    when: P3-P4 任何返修
    then: 返修消息逐条写“镜N：把「原文」插入 / 删除 / 整条移到镜M / 【配乐】避让写成「对白避让，独白避让」”这类可直接执行的指令（tools/pipeline/p4_fragments.py：repair_lines / speech_lines / spec_lines，run_chain 自动附上），不只转述规则号；点名后再返修 1 轮仍不过 → 枚举 / 槽位类由系统确定性修正并留痕（fix_cue_avoid 等，只改格式槽位），台词放哪一镜、拆镜这类内容决定标“待人工”
    targets: [{kind: writer_prompt, section: 分拍与动作}]
    writer_text: 返修时只照“镜N：…”逐条执行系统给出的插入 / 删除 / 移动指令，未被点名的镜逐字不动；一镜最多一条 🎙；同一镜既有台词又有 🎙 时【配乐】写“对白避让，独白避让”。
    evidence:
      - {src: data/pipeline/runs/series10_v1/ep05/P4_ep05.md.report.json, note: "只说“移到相邻空镜”时写作模型挪到了也有 🎙 的镜8；改为系统指名目标镜后定位正确；【配乐】三选一歧义两轮来回改，最终由系统确定性修正"}
      - {src: data/pipeline/runs/series10_v1/ep07/P4_ep07.md.report.json, note: "点名“两个避让都写”后一轮清零"}
      - {src: tests/test_p4_fragments.py}
