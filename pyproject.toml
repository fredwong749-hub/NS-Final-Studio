[project]
name = "ns-final-studio"
version = "0.1.0"
description = "NS-Final Studio: 剧本 → 首帧 → 视频 的自动化短剧生产系统"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "nudenet>=3.4.2",
    "torch>=2.15.0",
    "transformers>=5.22.0",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/schema/ns_schema", "services/agent/ns_agent", "services/render_router/ns_render", "services/api/ns_api", "services/orchestrator/ns_orch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
