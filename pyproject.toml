[project]
name = "ns-final-studio"
version = "0.1.0"
description = "NS-Final Studio: 剧本 → 首帧 → 视频 的自动化短剧生产系统"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "nudenet>=3.4.2",
    "torch>=2.15.0",
    "transformers>=5.22.0",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/schema/ns_schema", "services/agent/ns_agent", "services/render_router/ns_render", "services/api/ns_api", "services/orchestrator/ns_orch"]

[tool.pytest.ini_options]
# services/canvas_api（gpu3 渲染桥）的测试也从根目录跑（封板 T-1）；它的包 ns_canvas 不在本仓库 wheel 里，用 pythonpath 导入
testpaths = ["tests", "services/canvas_api/tests"]
# ITERAUDIT 11-01：importlib 导入模式——测试文件不再按文件名进 sys.modules（tests/ 与 services/canvas_api/tests 里同名测试文件不会互相顶掉）；
# tests 放进 pythonpath，保留“测试文件互相 import 夹具”（test_frame_jobs_w2 等）。tools/ 下同名脚本（run.py ×2 等）的裸 import 由
# tests/conftest.py 的歧义守卫拦截（tools/qa/script_name_guard.py）。
addopts = "--import-mode=importlib"
pythonpath = ["services/canvas_api", "tests"]
