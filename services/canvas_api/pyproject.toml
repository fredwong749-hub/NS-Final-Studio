[project]
name = "ns-canvas-api"
version = "0.1.0"
description = "NS-Final Studio gpu3 渲染桥：读 renders_gpu3 产物 + 只追加的重渲队列（见 docs/canvas.md）"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.8"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ns_canvas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
