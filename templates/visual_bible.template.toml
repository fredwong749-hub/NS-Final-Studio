# ===================================================================
# 视觉圣经模板（Visual Bible Template）
# 新故事：复制为 config/visual_bible.toml，按注释填写。字段含义见 docs/VISUAL_BIBLE.md。
# 带 <> 的为必填；其余为《为他而骚》验证过的默认值，可直接沿用。
# ===================================================================

[project]
name = "<故事名>"
script = "<剧本和镜头 Markdown 路径>"
image_doc = "<image 提示词文档路径，可空>"
corrector_doc = "<提示词纠正器文档路径，可空>"
aspect = "9:16"
pipeline = "image_to_video"

# -------------------------------------------------------------------
# 一、画面质感（镜头 / 色调 / 干净）
# -------------------------------------------------------------------
[look]
# 剧本里的“每条img统一后缀”优先；剧本没有时用 fallback_suffix（避免重复）
use_script_suffix = true
fallback_suffix = "专业电影镜头画面感，画面干净，85mm人像镜头f/1.2大光圈，主体锐利对焦，前景与背景奶油般柔焦虚化、柔和圆形光斑，浓郁饱和的暖色调电影调色，色彩丰富艳丽、通透明亮，柔和的大面积光源与暖调轮廓光、高光柔和不过曝，皮肤通透有真实质感，无字幕、无文字、无水印"   # A3 A4 A5 A6
lens = "Leica Summilux-SL 85mm f/1.2 级别的锐利解析力与微反差"           # A2：后缀没写 Leica 时补
lens_video = "Leica 镜头质感，高清锐利"                                  # A2
no_text = "无字幕、无文字、无水印"                                         # A3（剧本指定的屏幕文字例外）
style_negative = "字幕、文字、水印、logo、标题字、画面发灰、低饱和、暗沉脏色、过曝死白"
color_reference = "<色调参考图路径>"                  # A4：林晚定妆图的浓郁色调
color_match_strength = 0.6                                               # 首尾帧统一对齐参考色调
color_match_dark_shots = 0.3                                             # 夜景/暗场减弱，保留剧本光线
script_light_wins = true                                                 # 剧本写的光源（霓虹/警示黄灯/钠光）优先于全局暖调

[look.video]
style = "专业电影镜头画面感，大光圈浅景深，色彩丰富艳丽，画面干净，无字幕无文字"
tail = "动作流畅自然，保持首帧人物面部与装扮完全一致"                       # 《image提示词》§3.2 结尾固定句
negative = "人物变形，面部跳变，肢体崩坏，动作过快，画风变为动漫，出现多余人物，塑料皮肤，过度磨皮"

# -------------------------------------------------------------------
# 二、真人感（去 AI 味）——research v8
# -------------------------------------------------------------------
[realism]
final_model = "base"                 # 定稿用 Qwen 2.1 Base（Turbo 负面词无效、皮肤更塑料）
preview_model = "turbo"
steps = 35
cfg = 3.0
resolution_mp = 1.5                  # 约 1.5MP，再做低重绘第二遍
second_pass_denoise = 0.30
vae = "texture_fix_vae_for_qwen_image_2.1_bf16.safetensors"
loras = [
  { file = "krea2_film_texture_qwen21.safetensors", strength = 0.5 },
]
loras_ab = ["purelens_qwen21.safetensors", "nicegirls_v2_qwen21.safetensors"]
plate_loras = [                       # 只用于把风格化参考做成写实身份底板
  { file = "Qwen2.1_Anything2RealCharacters.safetensors", strength = 0.8 },
  { file = "krea2_film_texture_qwen21.safetensors", strength = 0.5 },
]
banned_loras = ["glamour_realism_qwen21.safetensors"]   # 用 AI 图训练，加重 AI 味
banned_words = ["娃娃感", "精致完美", "完美无瑕", "网红脸", "网红", "纯欲", "斩男", "严格保持图1的眼睛形状", "五官比例完全一致"]   # v8 + v9
skin_terms = "真实皮肤质感，可见细小毛孔与细软绒毛，自然的轻微不对称，眼睛为真实人眼大小"

# -------------------------------------------------------------------
# 三、材质与道具规则（出现关键词就追加，原文已含则跳过）
# -------------------------------------------------------------------
[[materials]]
id = "patent_gloss"                  # B8
match = ["漆皮", "ptxtrench", "ptxcorset", "ptxharness", "hh12patent"]
term = "漆皮为像抹了油一样的高亮镜面漆皮，表面湿润光泽，镜面反射清晰，高光锐利"

[[materials]]
id = "needle_heel"                   # B7
match = ["高跟", "细跟", "hh12clear", "hh12patent"]
term = "鞋跟直径约6毫米、细如一根筷子的针形细跟，跟高12厘米"

# -------------------------------------------------------------------
# 四、镜头类型规则（《3提示词纠正器》）
# -------------------------------------------------------------------
[[shot_rules]]
id = "closeup"                       # 纠正器 1.1
match = ["特写", "极近", "近景", "大特写"]
term = "面部清晰对焦，五官锐利"

[[shot_rules]]
id = "dark"                          # 纠正器 1.2
match = ["暗", "夜", "剪影", "黑暗", "深夜", "昏"]
term = "暗部保留细节，面部可辨，画面光比1:4，非纯黑"

[shot_rules_safe]                    # 纠正器 1.3（非成人镜头），B10：不保守，但不裸露
term = "衣装完整、无裸露"
negative = "裸露、走光、低俗姿势"

# -------------------------------------------------------------------
# 五、人物（身份 / 参考 / 妆容 / 美甲 / 穿搭）
# -------------------------------------------------------------------
[characters.<角色id>]
name = "<角色名>"
detect = ["<名字>", "<外貌关键词>"]
detect_she_with_trigger = ""        # 可空：首帧写“她”且 motion 带此触发词 → 该角色
identity_source = "script_lock"
identity_extra = ""
reference_master = "assets/characters/<角色id>/plates/master.png"
reference_fallback = ""
reference_role_line = "图1只提供面部与发型：保持同一人的脸型、五官与发型，不要沿用图1的姿势、服装、首饰和背景。"
face_ref_approval = "config/face_reference.json"
nails = ""
heels_default = ""
wardrobe_rule = ""
makeup_palette = ""
makeup_principles = "每款只有一个视觉焦点；腮红、唇色、眼影同一色温；雾面与水光对比；唇线边缘柔化；粉底下可见毛孔"

[characters.<角色id>.makeup_states]
default = { plate = "items/makeup/<id>", episodes = "default", name = "<妆容名>" }

# -------------------------------------------------------------------
# 六、提示词拼装顺序（《image提示词》§1.2 + 画面说明层）
# -------------------------------------------------------------------
[assembly]
first_frame = ["triggers", "character_dna", "shot_size_angle", "wardrobe_look", "pose_expression_start",
               "scene", "lighting", "script_img_verbatim", "materials", "shot_rules", "director_boost",
               "lens", "style_suffix"]
last_frame_keep = "图1是本镜头的首帧画面。保持图1的场景、机位、景别、光线、人物身份、发型与服装完全一致，只改变人物的动作与表情到本镜头结束时的状态。"
script_verbatim = true               # 剧本原文一字不改（§2.2 透传）
director_boost = "owner_only"        # 导演加强只放项目方写的内容（config/director_boost_*）

# -------------------------------------------------------------------
# 七、多轮生成与评分（C5）
# -------------------------------------------------------------------
[generation]
candidates_per_round = 3
max_rounds = 3
score_weights = { script_facts = 0.35, face = 0.25, realism = 0.15, color = 0.10, sharp_bokeh = 0.15 }
pass_threshold = 0.72
nudity_qc_non_adult = "hard_fail"

# -------------------------------------------------------------------
# 八、成人分类（由项目方启动渲染）
# -------------------------------------------------------------------
[classification]
minor_guard = "未成年人外观"         # 硬规则：所有负面词必须包含，不可覆盖
overrides = "config/adult_overrides.json"
keywords_source = "compiler"         # 关键词表暂留在 compiler.py（ADULT_KEYWORDS），下一步迁入此处
