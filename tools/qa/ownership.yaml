# 项目方任务（每轮第 1 步必须选至少一个；验收以“任务做成 + 内容正确”为准，不以分数为准）
owner_tasks:
  OT1: {name: 审一集的镜头行, done_when: "每镜的首帧 / 尾帧 / 视频 / 台词 = 后端该镜的当前版本；不同镜内容不同（data_parity）"}
  OT2: {name: 接受 / 打回一个候选, done_when: "一键生效、后端 current 真的变了、10 秒内撤销后后端恢复"}
  OT3: {name: 试听一句对白 / 音色 / 配乐, done_when: "▶ 播出的是这一镜这一句的音频文件（URL 与 /api/shots/{id}/audio 一致），能停、能 A/B"}
  OT4: {name: 放大看图, done_when: "大图是原图（不是缩略图）、是这一镜这一版，Esc 可关"}
  OT5: {name: 对照剧本看一镜, done_when: "界面显示的剧本原文 / 对白 / 造型 = 导入后的 Shot Spec 该镜字段（逐字）"}
  OT6: {name: 挑设定图 / 定脸, done_when: "候选并排、点选后资产库当前版本变化，下游解析器读到新图"}
  OT7: {name: 看成片 / 对比两版, done_when: "播放的是最新一版合成文件，两版同步播放"}
  OT8: {name: 新建剧本走到导入, done_when: "提纲 → P1–P4 可看可改，导入后画布出现新集且镜数一致"}
  OT9: {name: 看一镜生成结果是否合格, done_when: "GEN_CONTRACT 逐项结果表（未测 ≠ 通过）+ 总调度 master_review.md 签字后才给项目方"}

